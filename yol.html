  <h1 id="title">🐾 Yol Hafızası</h1>
  <div id="hud"><span>🏆 Tur: <span id="round">0</span></span><span>📣 <span id="status">Hazır olduğunda Başlat'a bas!</span></span></div>

  <button id="muteCtl">🔊</button>

<script src="common.js"></script>
<script>
let { theme, level } = getParams();
let pendingLevel = level;
setTitle('Yol Hafızası');
document.getElementById('title').textContent = `🐾 ${theme.name} Yol Hafızası`;
document.documentElement.style.setProperty('--th-1', theme.hue1);
document.documentElement.style.setProperty('--th-2', theme.hue2);
document.documentElement.style.setProperty('--th-bg1', theme.bg1);
document.documentElement.style.setProperty('--th-bg2', theme.bg2);

let muted = localStorage.getItem('ok_yol_muted') === '1';
const muteCtl = document.getElementById('muteCtl');
muteCtl.textContent = muted ? '🔇' : '🔊';
muteCtl.addEventListener('click', ()=>{
  muted = !muted; localStorage.setItem('ok_yol_muted', muted?'1':'0');
  muteCtl.textContent = muted?'🔇':'🔊';
  if(muted) stopThemeAmbient(); else startThemeAmbient(theme.ambient, ()=>muted);
});
function snd(fn){ if(!muted) fn(); }

let size, totalCells, speed, goalRounds;

let cells = [];
const gridEl = document.getElementById('grid');
function buildGrid(){
  gridEl.innerHTML = '';
  cells = [];
  for(let i=0;i<totalCells;i++){
    const div = document.createElement('div');
    div.className = 'cell pcell';
    div.dataset.i = i;
    div.onclick = ()=>handleClick(i);
    gridEl.appendChild(div);
    cells.push(div);
  }
}

let path = [], userStep = 0, round = 0, accepting = false;

function updateProgress(){
  const pct = Math.min(100, Math.round((round / goalRounds) * 100));
  document.getElementById('progressFill').style.width = pct + '%';
}

function startGame(){
  // Adaptif zorluk: bir önceki oyundaki performansa göre ayarlanan seviye burada devreye girer.
  level = pendingLevel;
  size = [null,3,4,4,5][level];
  totalCells = size*size;
  speed = [null,650,520,420,340][level];
  goalRounds = 6 + level * 2;
  document.getElementById('grid').style.gridTemplateColumns = `repeat(${size}, 58px)`;
  buildGrid();
  path = []; round = 0; userStep = 0;
  document.getElementById('round').textContent = round;
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('startBtn').style.display = 'none';
  updateProgress();
  const cd = document.getElementById('countdownOverlay');
  cd.style.display = 'flex';
  runCountdown(cd, ()=>{
    cd.style.display = 'none';
    snd(()=> startThemeAmbient(theme.ambient, ()=>muted));
    nextRound();
  });
}

function nextRound(){
  round++;
  document.getElementById('round').textContent = round;
  updateProgress();
  let next;
  do { next = Math.floor(Math.random()*totalCells); } while(next === path[path.length-1]);
  path.push(next);
  userStep = 0;
  playPath();
}

async function playPath(){
  accepting = false;
  document.getElementById('status').textContent = 'Dikkatle izle...';
  await new Promise(r=>setTimeout(r,400));
  for(const idx of path){
    cells[idx].classList.add('lit');
    snd(()=>playTone(380 + (idx*20), 0.18, 'sine', 0.13));
    await new Promise(r=>setTimeout(r,speed*0.65));
    cells[idx].classList.remove('lit');
    await new Promise(r=>setTimeout(r,speed*0.35));
  }
  accepting = true;
  document.getElementById('status').textContent = 'Sıra sende!';
}

function handleClick(i){
  if(!accepting) return;
  if(i === path[userStep]){
    cells[i].classList.add('done');
    snd(()=>playTone(380 + (i*20), 0.12, 'sine', 0.13));
    userStep++;
    if(userStep === path.length){
      accepting = false;
      document.getElementById('status').textContent = round >= 3 ? `🔥 ${round}. turu başarıyla tamamladın!` : 'Harika, aynen devam!';
      const r = cells[i].getBoundingClientRect(), pr = document.querySelector('.panel').getBoundingClientRect();
      const particles = [];
      spawnParticles(particles, r.left-pr.left+r.width/2, r.top-pr.top+r.height/2, 10, [theme.hue1, theme.hue2, '#FFD23F'], {speed:3.5, life:20});
      particles.forEach(p=>{
        const el = document.createElement('div');
        el.style.cssText = `position:absolute; left:${p.x}px; top:${p.y}px; width:${p.size}px; height:${p.size}px; border-radius:50%; background:${p.color}; pointer-events:none; z-index:6; transition:transform .5s ease, opacity .5s ease; opacity:1;`;
        document.querySelector('.panel').appendChild(el);
        requestAnimationFrame(()=>{ el.style.transform = `translate(${p.vx*12}px, ${p.vy*12}px)`; el.style.opacity = '0'; });
        setTimeout(()=> el.remove(), 520);
      });
      setTimeout(()=>{
        cells.forEach(c=>c.classList.remove('done'));
        nextRound();
      }, 700);
    }
  } else {
    accepting = false;
    stopThemeAmbient();
    snd(playError);
    cells[i].classList.add('wrong','shake');
    const finalRound = round - 1;
    document.getElementById('overMsg').textContent = `${finalRound}. tura kadar yolu hatırlayabildin!`;
    renderResultGrid('resultGrid', [['TUR', finalRound], ['SEVİYE', LEVEL_NAMES[level]]]);
    document.getElementById('stars').textContent = starRating(finalRound, goalRounds);
    earnXP(Math.min(30, 5 + finalRound*2), 'oyun-bitti');
    // Adaptif zorluk: hedef tur sayısına ne kadar yaklaştığına göre bir sonraki
    // oyunun seviyesini (dolayısıyla grid boyutu ve hızını) otomatik ayarla.
    const performanceRatio = Math.max(0, Math.min(1, finalRound / goalRounds));
    pendingLevel = computeAdaptiveLevel(level, performanceRatio);
    showAdaptiveNote(document.getElementById('overlay'), level, pendingLevel);
    showOverlay('overlay');
  }
}

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) stopThemeAmbient();
});

document.getElementById('startBtn').onclick = startGame;

initFullscreenButton('fsBtn', document.querySelector('.panel'));
</script>
