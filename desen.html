  <div id="hud">
    <span>🏆 Tur: <span id="round">0</span></span>
    <span id="comboBadge" class="combo-badge" style="display:none;"></span>
    <span>📣 <span id="status">Örüntüyü keşfet!</span></span>

      <button class="btn" onclick="startGame()">Tekrar Oyna</button>
      <a class="btn alt" href="index.html" style="text-decoration:none; display:inline-block;">Oyunlara Dön</a>
    </div>
  </div>
  <button id="muteCtl">🔊</button>

<script src="common.js"></script>
<script>
const { theme, level } = getParams();
setTitle('Desen Tamamlama');
document.getElementById('title').textContent = `🔮 ${theme.name} Desen Tamamlama`;
document.documentElement.style.setProperty('--th-1', theme.hue1);
document.documentElement.style.setProperty('--th-2', theme.hue2);
document.documentElement.style.setProperty('--th-bg1', theme.bg1);
document.documentElement.style.setProperty('--th-bg2', theme.bg2);

let muted = localStorage.getItem('ok_desen_muted') === '1';
const muteCtl = document.getElementById('muteCtl');
muteCtl.textContent = muted ? '🔇' : '🔊';
muteCtl.addEventListener('click', ()=>{
  muted = !muted; localStorage.setItem('ok_desen_muted', muted?'1':'0');
  muteCtl.textContent = muted?'🔇':'🔊';
});
function snd(fn){ if(!muted) fn(); }

const goalRounds = 5 + level * 2;
let round = 0, cycleLen, palette, cycle, seqLen, correctAnswer, answered, combo, started=false;

function updateProgress(){
  document.getElementById('progressFill').style.width = Math.min(100, Math.round((round/goalRounds)*100)) + '%';
}

function startGame(){
  round = 0; started = false;
  combo = createCombo();
  document.getElementById('round').textContent = 0;
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('comboBadge').style.display = 'none';
  updateProgress();
  const cd = document.getElementById('countdownOverlay');
  cd.style.display = 'flex';
  runCountdown(cd, ()=>{ cd.style.display = 'none'; started = true; nextRound(); });
}

function nextRound(){
  round++;
  document.getElementById('round').textContent = round;
  updateProgress();
  answered = false;
  cycleLen = Math.min(theme.emojis.length, 2 + Math.min(level, 3) + (round > goalRounds/2 ? 1 : 0));
  cycleLen = Math.max(2, Math.min(cycleLen, 5));
  palette = shuffle(theme.emojis).slice(0, Math.max(cycleLen + 2, 5));
  cycle = palette.slice(0, cycleLen);
  seqLen = cycleLen * 2 + Math.min(2, level);
  correctAnswer = cycle[seqLen % cycleLen];

  const seqEl = document.getElementById('sequence');
  seqEl.innerHTML = '';
  for(let i=0;i<seqLen;i++){
    const div = document.createElement('div');
    div.className = 'seq-item pop';
    div.style.animationDelay = (i*0.04)+'s';
    div.textContent = cycle[i % cycleLen];
    seqEl.appendChild(div);
  }
  const blank = document.createElement('div');
  blank.className = 'seq-item blank pop';
  blank.textContent = '?';
  seqEl.appendChild(blank);

  const distractors = shuffle(palette.filter(e=>e!==correctAnswer)).slice(0,3);
  const options = shuffle([correctAnswer, ...distractors]);
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  options.forEach(opt=>{
    const btn = document.createElement('div');
    btn.className = 'choice pop';
    btn.textContent = opt;
    btn.onclick = ()=>handleAnswer(opt, btn);
    choicesEl.appendChild(btn);
  });
  document.getElementById('status').textContent = 'Bu örüntüde sırada ne var, bulabilir misin?';
}

function handleAnswer(opt, btn){
  if(answered) return;
  answered = true;
  const isCorrect = opt === correctAnswer;
  document.querySelectorAll('.choice').forEach(c=>{
    if(c.textContent === correctAnswer) c.classList.add('correct');
    else if(c === btn) c.classList.add('wrong');
  });
  if(isCorrect){
    const level_ = combo.register();
    renderComboBadge('comboBadge', level_);
    snd(playSuccess);
    if(level_>1) snd(()=>playCombo(level_));
    document.getElementById('status').textContent = level_>1 ? `🔥 x${level_} Doğru!` : 'Doğru!';
    const r = btn.getBoundingClientRect(), pr = document.querySelector('.panel').getBoundingClientRect();
    showFloatingPoints(document.querySelector('.panel'), r.left-pr.left+r.width/2, r.top-pr.top, level_>1 ? `🔥 x${level_}` : '✓', theme.hue1);
    setTimeout(nextRound, 700);
  } else {
    combo.reset();
    document.getElementById('comboBadge').style.display = 'none';
    snd(playError);
    triggerWrongFx(document.querySelector('.panel'));
    const finalRound = round - 1;
    document.getElementById('overMsg').textContent = `${finalRound}. tura kadar tüm örüntüleri doğru çözdün, harika gidiyordun!`;
    renderResultGrid('resultGrid', [['TUR', finalRound], ['SEVİYE', LEVEL_NAMES[level]], ['EN İYİ SERİ', 'x'+combo.level]]);
    document.getElementById('stars').textContent = starRating(finalRound, goalRounds);
    earnXP(Math.min(30, 5 + finalRound*2), 'oyun-bitti');
    setTimeout(()=>{ showOverlay('overlay'); }, 500);
  }
}

startGame();

initFullscreenButton('fsBtn', document.querySelector('.panel'));
</script>
