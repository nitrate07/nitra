<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sıra Takibi — Oyun Kutusu</title>
<meta name="description" content="Sırayı ezberle, tekrar et! Ücretsiz hafıza ve dikkat oyunu, çocuklar için eğlenceli.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://SITE-ADRESIN-BURAYA.com/simon.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Sıra Takibi — Oyun Kutusu">
<meta property="og:description" content="Sırayı ezberle, tekrar et! Ücretsiz hafıza ve dikkat oyunu, çocuklar için eğlenceli.">
<meta property="og:url" content="https://SITE-ADRESIN-BURAYA.com/simon.html">
<meta property="og:site_name" content="Oyun Kutusu">
<meta property="og:locale" content="tr_TR">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Sıra Takibi — Oyun Kutusu">
<meta name="twitter:description" content="Sırayı ezberle, tekrar et! Ücretsiz hafıza ve dikkat oyunu, çocuklar için eğlenceli.">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  #pad{display:grid; grid-template-columns:repeat(2, 100px); grid-template-rows:repeat(2, 100px); gap:10px;}
  .pad-btn{
    width:100px; height:100px; border-radius:20px; font-size:2.4rem; opacity:.5;
    box-shadow:0 5px 0 rgba(0,0,0,.15); transition:opacity .12s, transform .12s;
  }
  .pad-btn.lit{opacity:1; transform:scale(1.08); box-shadow:0 2px 0 rgba(0,0,0,.15), 0 0 24px 4px rgba(108,78,245,.5);}
  .pad-btn:nth-child(1){background:#FFD9D9;}
  .pad-btn:nth-child(2){background:#D9F0FF;}
  .pad-btn:nth-child(3){background:#FFF3D6;}
  .pad-btn:nth-child(4){background:#DFF8F0;}
</style>
</head>
<body>
  <a class="back" href="index.html">← Oyunlara dön</a>
  <h1 id="title">🔁 Sıra Takibi</h1>
  <div id="hud"><span>🏆 Tur: <span id="round">0</span></span><span>📣 Durum: <span id="status">Başla</span></span></div>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="panel">
    <div id="pad"></div>
    <div id="overlay">
      <div class="big">😿</div>
      <div class="msg" id="overMsg"></div>
      <div class="stars" id="stars"></div>
      <button class="btn" onclick="startGame()">Tekrar Oyna</button>
      <a class="btn alt" href="index.html" style="text-decoration:none; display:inline-block;">Oyunlara Dön</a>
    </div>
  </div>
  <button class="btn alt" id="startBtn" style="margin-top:16px;">Başlat</button>

<script src="common.js"></script>
<script>
const { theme, level } = getParams();
setTitle('Sıra Takibi');
document.getElementById('title').textContent = `🔁 ${theme.name} Sıra Takibi`;

const padEmojis = theme.emojis.slice(0,4);
const tones = [392, 494, 587, 659]; // her tuşun kendi notası
const speed = [null, 700, 550, 420, 320][level];
const goalRounds = 6 + level * 2; // yıldız hesaplama referansı
let sequence = [], userStep = 0, round = 0, accepting = false;

const padEl = document.getElementById('pad');
padEmojis.forEach((e,i)=>{
  const b = document.createElement('div');
  b.className = 'cell pad-btn';
  b.textContent = e;
  b.dataset.i = i;
  b.onclick = ()=>handleClick(i);
  padEl.appendChild(b);
});
const buttons = Array.from(document.querySelectorAll('.pad-btn'));

function updateProgress(){
  const pct = Math.min(100, Math.round((round / goalRounds) * 100));
  document.getElementById('progressFill').style.width = pct + '%';
}

function startGame(){
  sequence = []; round = 0; userStep = 0;
  document.getElementById('round').textContent = round;
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('startBtn').style.display = 'none';
  updateProgress();
  nextRound();
}

function nextRound(){
  round++;
  document.getElementById('round').textContent = round;
  updateProgress();
  sequence.push(Math.floor(Math.random()*4));
  userStep = 0;
  playSequence();
}

async function playSequence(){
  accepting = false;
  document.getElementById('status').textContent = 'İzle...';
  await new Promise(r=>setTimeout(r,400));
  for(const idx of sequence){
    buttons[idx].classList.add('lit');
    playTone(tones[idx], 0.2, 'sine', 0.15);
    await new Promise(r=>setTimeout(r,speed*0.6));
    buttons[idx].classList.remove('lit');
    await new Promise(r=>setTimeout(r,speed*0.4));
  }
  accepting = true;
  document.getElementById('status').textContent = 'Sıra sende!';
}

function handleClick(i){
  if(!accepting) return;
  buttons[i].classList.add('lit');
  playTone(tones[i], 0.15, 'sine', 0.15);
  setTimeout(()=>buttons[i].classList.remove('lit'), 200);
  if(i === sequence[userStep]){
    userStep++;
    if(userStep === sequence.length){
      accepting = false;
      document.getElementById('status').textContent = 'Harika!';
      setTimeout(nextRound, 700);
    }
  } else {
    accepting = false;
    playError();
    document.querySelector('.panel').classList.add('shake');
    setTimeout(()=>document.querySelector('.panel').classList.remove('shake'), 350);
    const finalRound = round - 1;
    document.getElementById('overMsg').textContent = `${finalRound}. tura kadar hatırladın!`;
    document.getElementById('stars').textContent = starRating(finalRound, goalRounds);
    document.getElementById('overlay').style.display = 'flex';
  }
}

document.getElementById('startBtn').onclick = startGame;
document.getElementById('status').textContent = "Başlat'a bas";
</script>
</body>
</html>
