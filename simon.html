<body>
  <button id="muteCtl">🔊</button>
  <a class="back" href="index.html">← Oyunlara dön</a>
  <h1 id="title">🔁 Sıra Takibi</h1>
  <div id="hud"><span>🏆 Tur: <span id="round">0</span></span><span>📣 Durum: <span id="status">Başla</span></span></div>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="panel">
    <button id="fsBtn" class="fs-btn">⛶</button>
    <div id="pad"></div>
    <div id="countdownOverlay"></div>
    <div id="overlay">
      <div class="big">😿</div>
      <div class="msg" id="overMsg"></div>
      <div class="result-grid" id="resultGrid"></div>
      <div class="stars" id="stars"></div>
      <button class="btn" onclick="startGame()">Tekrar Oyna</button>
      <a class="btn alt" href="index.html" style="text-decoration:none; display:inline-block;">Oyunlara Dön</a>
    </div>
  </div>
  <button class="btn alt" id="startBtn" style="margin-top:16px;">Başlat</button>

<script src="common.js"></script>
<script>
let { theme, level } = getParams();
let pendingLevel = level;
setTitle('Sıra Takibi');
document.getElementById('title').textContent = `🔁 ${theme.name} Sıra Takibi`;
document.documentElement.style.setProperty('--th-1', theme.hue1);
document.documentElement.style.setProperty('--th-2', theme.hue2);
document.documentElement.style.setProperty('--th-bg1', theme.bg1);
document.documentElement.style.setProperty('--th-bg2', theme.bg2);

let muted = localStorage.getItem('ok_simon_muted') === '1';
const muteCtl = document.getElementById('muteCtl');
muteCtl.textContent = muted ? '🔇' : '🔊';
muteCtl.addEventListener('click', ()=>{
  muted = !muted; localStorage.setItem('ok_simon_muted', muted?'1':'0');
  muteCtl.textContent = muted?'🔇':'🔊';
  if(muted) stopThemeAmbient(); else startThemeAmbient(theme.ambient, ()=>muted);
});
function snd(fn){ if(!muted) fn(); }

const padEmojis = theme.emojis.slice(0,4);
const tones = [392, 494, 587, 659]; // her tuşun kendi notası
let speed, goalRounds;
let sequence = [], userStep = 0, round = 0, accepting = false;

const padEl = document.getElementById('pad');
padEmojis.forEach((e,i)=>{
  const b = document.createElement('div');
  b.className = 'cell pad-btn';
  b.textContent = e;
  b.dataset.i = i;
  b.onclick = ()=>handleClick(i);
  padEl.appendChild(b);
});
const buttons = Array.from(document.querySelectorAll('.pad-btn'));

function updateProgress(){
  const pct = Math.min(100, Math.round((round / goalRounds) * 100));
  updateProgressBar(document.getElementById('progressFill'), pct);
}

function startGame(){
  // Adaptif zorluk: bir önceki oyundaki performansa göre ayarlanan seviye burada devreye girer.
  level = pendingLevel;
  speed = [null, 700, 550, 420, 320][level];
  goalRounds = 6 + level * 2; // yıldız hesaplama referansı
  sequence = []; round = 0; userStep = 0;
  document.getElementById('round').textContent = round;
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('startBtn').style.display = 'none';
  updateProgress();
  const cd = document.getElementById('countdownOverlay');
  cd.style.display = 'flex';
  runCountdown(cd, ()=>{
    cd.style.display = 'none';
    snd(()=> startThemeAmbient(theme.ambient, ()=>muted));
    nextRound();
  });
}

function nextRound(){
  round++;
  document.getElementById('round').textContent = round;
  updateProgress();
  sequence.push(Math.floor(Math.random()*4));
  userStep = 0;
  playSequence();
}

async function playSequence(){
  accepting = false;
  document.getElementById('status').textContent = 'Dikkatle izle...';
  await new Promise(r=>setTimeout(r,400));
  for(const idx of sequence){
    buttons[idx].classList.add('lit');
    snd(()=>playTone(tones[idx], 0.2, 'sine', 0.15));
    await new Promise(r=>setTimeout(r,speed*0.6));
    buttons[idx].classList.remove('lit');
    await new Promise(r=>setTimeout(r,speed*0.4));
  }
  accepting = true;
  document.getElementById('status').textContent = 'Sıra sende!';
}

function handleClick(i){
  if(!accepting) return;
  buttons[i].classList.add('lit');
  snd(()=>playTone(tones[i], 0.15, 'sine', 0.15));
  setTimeout(()=>buttons[i].classList.remove('lit'), 200);
  if(i === sequence[userStep]){
    userStep++;
    if(userStep === sequence.length){
      accepting = false;
      document.getElementById('status').textContent = round >= 3 ? `🔥 ${round}. tur tamamlandı!` : 'Harika, doğru hatırladın!';
      const btnRect = buttons[i].getBoundingClientRect(), panelRect = document.querySelector('.panel').getBoundingClientRect();
      const particles = [];
      spawnParticles(particles, btnRect.left-panelRect.left+btnRect.width/2, btnRect.top-panelRect.top+btnRect.height/2, 10,
        [theme.hue1, theme.hue2, '#FFD23F'], {speed:3.5, life:20});
      renderDomParticles(document.querySelector('.panel'), particles);
      setTimeout(nextRound, 700);
    }
  } else {
    accepting = false;
    stopThemeAmbient();
    snd(playError);
    triggerWrongFx(document.querySelector('.panel'));
    const finalRound = round - 1;
    document.getElementById('overMsg').textContent = `Hafızan seni ${finalRound}. tura kadar taşıdı!`;
    renderResultGrid('resultGrid', [['TUR', finalRound], ['SEVİYE', LEVEL_NAMES[level]]]);
    document.getElementById('stars').textContent = starRating(finalRound, goalRounds);
    // Adaptif zorluk: hedef tur sayısına ne kadar yaklaştığına göre bir sonraki
    // oyunun seviyesini (dolayısıyla sıra hızını) otomatik ayarla.
    const performanceRatio = Math.max(0, Math.min(1, finalRound / goalRounds));
    pendingLevel = computeAdaptiveLevel(level, performanceRatio);
    showAdaptiveNote(document.getElementById('overlay'), level, pendingLevel);
    showOverlay('overlay', finalRound >= goalRounds ? {celebrate:true} : undefined);
    if(finalRound >= goalRounds) fireConfetti(document.querySelector('.panel'), {big:true});
  }
}

function renderDomParticles(container, particles){
  particles.forEach(p=>{
    const el = document.createElement('div');
    el.style.cssText = `position:absolute; left:${p.x}px; top:${p.y}px; width:${p.size}px; height:${p.size}px; border-radius:50%; background:${p.color}; pointer-events:none; z-index:6; transition:transform .5s ease, opacity .5s ease; opacity:1;`;
    container.appendChild(el);
    requestAnimationFrame(()=>{ el.style.transform = `translate(${p.vx*12}px, ${p.vy*12}px)`; el.style.opacity = '0'; });
    setTimeout(()=> el.remove(), 520);
  });
}

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) stopThemeAmbient();
});

document.getElementById('startBtn').onclick = startGame;
document.getElementById('status').textContent = "Başlat'a bas";

initFullscreenButton('fsBtn', document.querySelector('.panel'));
</script>
</body>
