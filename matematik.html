<script src="common.js"></script>
<script>
const { theme, level } = getParams();
setTitle('Matematik Yarışı');
document.getElementById('title').textContent = `🔢 ${theme.name} Matematik Yarışı`;
document.getElementById('banner').textContent = theme.emojis[0];

const goalRounds = 8 + level * 2;
const timePerQ = [null, 10, 8, 7, 6][level]; // saniye
let score = 0, wrong = 0, round = 0, running = true, timeLeft, timerInterval, correctAnswer, answered;
let streak = 0, comboLevel = 1;

function updateCombo(){
  comboLevel = Math.min(4, 1 + Math.floor(streak/2));
  renderComboBadge('comboBadge', comboLevel);
}

function genProblem(){
  let a, b, op, answer;
  if(level === 1){ // toplama, 1-10
    a = 1+Math.floor(Math.random()*10); b = 1+Math.floor(Math.random()*10);
    op = '+'; answer = a+b;
  } else if(level === 2){ // toplama/çıkarma, 1-20
    a = 1+Math.floor(Math.random()*20); b = 1+Math.floor(Math.random()*a);
    op = Math.random()<0.5 ? '+' : '-';
    if(op==='+'){ b = 1+Math.floor(Math.random()*(20-a>0?20-a:5)); answer = a+b; }
    else { answer = a-b; }
  } else if(level === 3){ // çarpım tablosu 1-10
    a = 1+Math.floor(Math.random()*10); b = 1+Math.floor(Math.random()*10);
    op = '×'; answer = a*b;
  } else { // karışık, büyük sayılar + çarpım/bölüm
    const r = Math.random();
    if(r < 0.4){ a=10+Math.floor(Math.random()*40); b=10+Math.floor(Math.random()*40); op='+'; answer=a+b; }
    else if(r < 0.7){ a=1+Math.floor(Math.random()*12); b=1+Math.floor(Math.random()*12); op='×'; answer=a*b; }
    else { b=1+Math.floor(Math.random()*10); answer=1+Math.floor(Math.random()*10); a=b*answer; op='÷'; }
  }
  return { text: `${a} ${op} ${b} = ?`, answer };
}

function updateProgress(){
  updateProgressBar(document.getElementById('progressFill'), Math.min(100, Math.round((round/goalRounds)*100)));
}

function startGame(){
  score = 0; wrong = 0; round = 0; running = true; streak = 0; comboLevel = 1;
  document.getElementById('score').textContent = 0;
  document.getElementById('wrong').textContent = 0;
  document.getElementById('overlay').style.display = 'none';
  renderComboBadge('comboBadge', 1);
  updateProgress();
  nextRound();
}

function nextRound(){
  round++;
  updateProgress();
  answered = false;
  const p = genProblem();
  correctAnswer = p.answer;
  document.getElementById('problem').textContent = p.text;

  const distractors = new Set();
  while(distractors.size < 3){
    const delta = Math.floor(Math.random()*8)-4;
    const d = correctAnswer + (delta===0 ? 5 : delta);
    if(d !== correctAnswer && d >= 0) distractors.add(d);
  }
  const options = shuffle([correctAnswer, ...distractors]);
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  options.forEach(opt=>{
    const div = document.createElement('div');
    div.className = 'choice pop';
    div.textContent = opt;
    div.onclick = ()=>handleAnswer(opt, div);
    choicesEl.appendChild(div);
  });

  timeLeft = timePerQ;
  document.getElementById('timerFill').style.width = '100%';
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    timeLeft -= 0.1;
    document.getElementById('timerFill').style.width = Math.max(0,(timeLeft/timePerQ)*100) + '%';
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      if(!answered) handleAnswer(null, null);
    }
  }, 100);
}

function handleAnswer(opt, btn){
  if(answered) return;
  answered = true;
  clearInterval(timerInterval);
  const isCorrect = opt === correctAnswer;
  document.querySelectorAll('.choice').forEach(c=>{
    if(parseInt(c.textContent,10) === correctAnswer) c.classList.add('correct');
    else if(c === btn) c.classList.add('wrong');
  });
  if(isCorrect){
    streak++;
    updateCombo();
    const gained = 1 * comboLevel;
    score += gained;
    document.getElementById('score').textContent = score;
    playSuccess();
    if(comboLevel > 1){ playCombo(comboLevel); }
    if(btn){
      const r = btn.getBoundingClientRect(), pr = document.querySelector('.panel').getBoundingClientRect();
      showFloatingPoints(document.querySelector('.panel'), r.left-pr.left+r.width/2, r.top-pr.top,
        comboLevel>1 ? `🔥 COMBO x${comboLevel} +${gained}` : `+${gained}`, comboLevel>1 ? '#FF9F43' : '#2EC4B6');
    }
    setTimeout(nextRound, 600);
  } else {
    streak = 0; updateCombo();
    wrong++;
    document.getElementById('wrong').textContent = wrong;
    playError();
    triggerWrongFx(document.getElementById('problem'));
    if(wrong >= 3){
      setTimeout(()=>{
        document.getElementById('overMsg').textContent = `Süper hesap yaptın! Bu yarışta ${score} puan topladın.`;
        renderResultGrid('resultGrid', [
          ['DOĞRU', round-wrong], ['SKOR', score], ['TUR', round], ['EN İYİ COMBO', 'x'+comboLevel]
        ]);
        document.getElementById('stars').textContent = starRating(score, goalRounds);
        earnXP(Math.min(30, 5 + round*2), 'oyun-bitti');
        showOverlay('overlay');
      }, 700);
    } else {
      setTimeout(nextRound, 900);
    }
  }
}

startGame();

initFullscreenButton('fsBtn', document.querySelector('.panel'));
</script>
