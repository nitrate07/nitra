<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const laneCount = 3;
const ROAD_MARGIN = 46;
const roadWidth = W - ROAD_MARGIN*2;
const laneW = roadWidth / laneCount;
const laneX = i => ROAD_MARGIN + laneW*i + laneW/2;

let bestScore = parseInt(localStorage.getItem('ok_araba_best_v3') || '0', 10);
document.getElementById('best').textContent = bestScore;

const CAR_COLORS = ['#ff3d6e','#3dd6ff','#ffd23f','#7bff6b','#c96bff','#ff9f3d'];

// ================= SES MOTORU (Web Audio API, tek AudioContext) =================
const Audio_ = (function(){
  let unlocked = false;
  let muted = localStorage.getItem('ok_araba_muted') === '1';
  let engineOsc1, engineOsc2, engineFilter, engineGain;
  let noiseBuffer;
  let musicOn = false, musicStep = 0, musicTimeoutId = null;

  function getCtx(){ return _ctx(); } // common.js'teki paylaşılan AudioContext

  function unlock(){
    if(unlocked) return;
    unlocked = true;
    try{ getCtx().resume(); }catch(e){}
  }

  function makeNoiseBuffer(){
    if(noiseBuffer) return noiseBuffer;
    const c = getCtx();
    const len = Math.floor(c.sampleRate * 0.5);
    noiseBuffer = c.createBuffer(1, len, c.sampleRate);
    const d = noiseBuffer.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    return noiseBuffer;
  }

  function tone(freq, dur=0.15, type='sine', vol=0.18, delay=0){
    if(muted) return;
    try{
      const c = getCtx();
      const t0 = c.currentTime + delay;
      const osc = c.createOscillator(); const gain = c.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(Math.max(vol,0.001), t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(t0); osc.stop(t0+dur+0.03);
    }catch(e){}
  }

  function noiseBurst(dur=0.3, vol=0.3, filterFreq=1200, type='lowpass', delay=0){
    if(muted) return;
    try{
      const c = getCtx();
      const t0 = c.currentTime + delay;
      const src = c.createBufferSource(); src.buffer = makeNoiseBuffer();
      const filt = c.createBiquadFilter(); filt.type = type; filt.frequency.setValueAtTime(filterFreq, t0);
      const gain = c.createGain();
      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
      src.connect(filt); filt.connect(gain); gain.connect(c.destination);
      src.start(t0); src.stop(t0+dur+0.05);
    }catch(e){}
  }

  function startEngine(){
    if(muted || engineOsc1) return;
    try{
      const c = getCtx();
      engineOsc1 = c.createOscillator(); engineOsc1.type = 'sawtooth';
      engineOsc2 = c.createOscillator(); engineOsc2.type = 'square';
      engineFilter = c.createBiquadFilter(); engineFilter.type = 'lowpass'; engineFilter.frequency.value = 400;
      engineGain = c.createGain(); engineGain.gain.value = 0.0001;
      engineOsc1.frequency.value = 60; engineOsc2.frequency.value = 60.5;
      engineOsc1.connect(engineFilter); engineOsc2.connect(engineFilter);
      engineFilter.connect(engineGain); engineGain.connect(c.destination);
      engineOsc1.start(); engineOsc2.start();
      engineGain.gain.linearRampToValueAtTime(0.045, c.currentTime + 0.4);
    }catch(e){}
  }
  function updateEngine(speedRatio, boosting){
    if(!engineOsc1) return;
    try{
      const c = getCtx();
      const base = 55 + speedRatio*150 + (boosting?70:0);
      engineOsc1.frequency.setTargetAtTime(base, c.currentTime, 0.08);
      engineOsc2.frequency.setTargetAtTime(base*1.008, c.currentTime, 0.08);
      engineFilter.frequency.setTargetAtTime(300 + speedRatio*2200 + (boosting?900:0), c.currentTime, 0.1);
      const vol = muted ? 0 : (0.03 + speedRatio*0.045 + (boosting?0.04:0));
      engineGain.gain.setTargetAtTime(vol, c.currentTime, 0.08);
    }catch(e){}
  }
  function stopEngine(){
    if(!engineOsc1) return;
    try{
      const c = getCtx();
      engineGain.gain.setTargetAtTime(0.0001, c.currentTime, 0.15);
      const o1 = engineOsc1, o2 = engineOsc2;
      setTimeout(()=>{ try{ o1.stop(); o2.stop(); }catch(e){} }, 400);
    }catch(e){}
    engineOsc1 = engineOsc2 = engineFilter = engineGain = null;
  }

  function nitroWhoosh(){ noiseBurst(0.5, 0.2, 2200, 'bandpass'); tone(180,0.4,'sawtooth',0.1); tone(900,0.3,'sine',0.07,0.05); }
  function crash(){ noiseBurst(0.4, 0.32, 700, 'lowpass'); tone(90,0.35,'square',0.2); }
  function coin(){ tone(700,0.08,'triangle',0.13); tone(1050,0.12,'triangle',0.12,0.06); }
  function pickupNitro(){ tone(500,0.08,'sine',0.13); tone(850,0.16,'sine',0.14,0.06); }
  function countdownBeep(){ tone(440,0.12,'square',0.15); }
  function goBeep(){ tone(220,0.05,'square',0.18); tone(880,0.35,'sawtooth',0.18,0.03); }
  function winJingle(){ [523,659,784,1046].forEach((f,i)=> tone(f,0.22,'triangle',0.15,i*0.11)); }
  function loseJingle(){ [300,260,200].forEach((f,i)=> tone(f,0.3,'sawtooth',0.13,i*0.13)); }

  // basit synthwave arpej döngüsü (yarış müziği, dosya gerektirmez)
  const arp = [220,262,330,392, 330,392,440,523];
  function scheduleMusic(){
    if(!musicOn){ musicTimeoutId = null; return; }
    if(!muted){
      const f = arp[musicStep % arp.length];
      tone(f, 0.22, 'triangle', 0.045);
      if(musicStep % 4 === 0) tone(55, 0.5, 'sawtooth', 0.05);
    }
    musicStep++;
    musicTimeoutId = setTimeout(scheduleMusic, 230);
  }
  function startMusic(){ if(musicOn) return; musicOn = true; scheduleMusic(); }
  function stopMusic(){ musicOn = false; if(musicTimeoutId){ clearTimeout(musicTimeoutId); musicTimeoutId = null; } }

  function setMuted(v){
    muted = v; localStorage.setItem('ok_araba_muted', v ? '1' : '0');
    if(muted) stopEngine();
  }
  function isMuted(){ return muted; }

  return { unlock, startEngine, updateEngine, stopEngine, nitroWhoosh, crash, coin, pickupNitro,
    countdownBeep, goBeep, winJingle, loseJingle, startMusic, stopMusic, setMuted, isMuted, tone };
})();

// ---- Detaylı araba çizimi (gövde + spoiler + jantlar + camlar) ----
function drawCar(x, y, color, tilt=0, glow=1, driving=true, scale=1){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);
  ctx.scale(scale, scale);
  const w = 34, h = 58;

  // gölge
  ctx.save();
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(2, h*0.5, w*0.5, 7, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // neon alt parlama
  ctx.save();
  ctx.globalAlpha = 0.55*glow;
  ctx.shadowColor = color; ctx.shadowBlur = 20;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(0, h*0.32, w*0.58, 9, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // arka spoiler
  ctx.fillStyle = '#0e0c1c';
  ctx.fillRect(-w*0.42, h*0.42, w*0.84, 5);
  ctx.fillRect(-w*0.38, h*0.34, 4, 10);
  ctx.fillRect(w*0.34, h*0.34, 4, 10);

  // gövde
  ctx.beginPath();
  ctx.moveTo(-w*0.32, h*0.5);
  ctx.quadraticCurveTo(-w*0.5, h*0.15, -w*0.34, -h*0.28);
  ctx.quadraticCurveTo(-w*0.22, -h*0.5, 0, -h*0.5);
  ctx.quadraticCurveTo(w*0.22, -h*0.5, w*0.34, -h*0.28);
  ctx.quadraticCurveTo(w*0.5, h*0.15, w*0.32, h*0.5);
  ctx.closePath();
  const grad = ctx.createLinearGradient(-w/2,0,w/2,0);
  grad.addColorStop(0, '#0e0c1c'); grad.addColorStop(0.5, color); grad.addColorStop(1, '#0e0c1c');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 1;
  ctx.stroke();

  // orta şerit (racing stripe)
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fillRect(-2, -h*0.46, 4, h*0.9);

  // gövde parlaklığı (premium gloss)
  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-w*0.06, -h*0.14, w*0.26, h*0.14, -0.3, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // ön/yan camlar
  ctx.fillStyle = 'rgba(180,230,255,.9)';
  ctx.beginPath();
  ctx.moveTo(-w*0.2,-h*0.05); ctx.lineTo(w*0.2,-h*0.05); ctx.lineTo(w*0.14,-h*0.32); ctx.lineTo(-w*0.14,-h*0.32);
  ctx.closePath(); ctx.fill();

  // farlar
  ctx.fillStyle = '#fff8c8';
  ctx.shadowColor = '#fff8c8'; ctx.shadowBlur = driving ? 10 : 0;
  ctx.beginPath(); ctx.ellipse(-w*0.26,-h*0.47,3.6,2.6,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(w*0.26,-h*0.47,3.6,2.6,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  // far ışık konisi (sadece oyuncu arabası sürerken)
  if(driving){
    ctx.save();
    const beam = ctx.createLinearGradient(0,-h*0.5,0,-h*1.4);
    beam.addColorStop(0, 'rgba(255,248,200,.28)'); beam.addColorStop(1, 'rgba(255,248,200,0)');
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(-w*0.26,-h*0.47); ctx.lineTo(-w*0.7,-h*1.3); ctx.lineTo(w*0.7,-h*1.3); ctx.lineTo(w*0.26,-h*0.47);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // arka stoplar
  ctx.fillStyle = '#ff3d3d'; ctx.shadowColor='#ff3d3d'; ctx.shadowBlur = glow>1 ? 10 : 3;
  ctx.beginPath(); ctx.ellipse(-w*0.27,h*0.43,3.2,2.4,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(w*0.27,h*0.43,3.2,2.4,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // tekerlekler + jantlar
  [[-w*0.42,-h*0.22],[w*0.42,-h*0.22],[-w*0.42,h*0.22],[w*0.42,h*0.22]].forEach(([tx,ty])=>{
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(tx-3.5, ty-9, 7, 18, 3) : ctx.rect(tx-3.5, ty-9, 7, 18); ctx.fill();
    ctx.fillStyle = '#999';
    ctx.beginPath(); ctx.arc(tx, ty, 2, 0, Math.PI*2); ctx.fill();
  });

  ctx.restore();
}

let player, obstacles, particles, trail, score, speed, running, spawnTimer, roadOffset;
let nitro, nitroActive, shakeMag, farStars, skylineOffset, buildingsL, buildingsR, guardOffset, keysHeld={};
let neonSigns, farLights, frameCount, wasBoosting;

function makeBuildings(){
  const arr = [];
  let y = -50;
  while(y < H+100){
    arr.push({ y, h: 50+Math.random()*110, lit: Math.random()<0.6, hue: Math.random()<0.5 ? '124,233,255' : '255,140,220' });
    y += 60 + Math.random()*55;
  }
  return arr;
}
function makeStars(){
  const arr = [];
  for(let i=0;i<50;i++) arr.push({ x: Math.random()*W, y: Math.random()*H*0.55, r: Math.random()*1.6+0.4 });
  return arr;
}
function makeNeonSigns(){
  const arr = [];
  const hues = ['#ff3d9e','#3dd6ff','#ffd23f','#7bff6b'];
  for(let i=0;i<5;i++){
    arr.push({ side: Math.random()<0.5?'left':'right', y: Math.random()*H, w: 24+Math.random()*18, h: 9+Math.random()*5,
      hue: hues[Math.floor(Math.random()*hues.length)], blink: Math.random()*Math.PI*2 });
  }
  return arr;
}

function startGame(){
  player = { lane: 1, x: laneX(1), y: H-140, tilt: 0, targetTilt: 0, bob: 0 };
  obstacles = []; particles = []; trail = [];
  score = 0; speed = 3.6; running = false; roadOffset = 0; guardOffset = 0; skylineOffset = 0;
  nitro = 100; nitroActive = false; shakeMag = 0; frameCount = 0; wasBoosting = false;
  buildingsL = makeBuildings(); buildingsR = makeBuildings(); farStars = makeStars();
  neonSigns = makeNeonSigns(); farLights = [];
  document.getElementById('score').textContent = 0;
  document.getElementById('speedNum').textContent = 0;
  document.getElementById('raceProgress').style.width = '0%';
  document.getElementById('overlay').style.display = 'none';
  spawnTimer = 0;
  drawStaticFrame();
  runCountdown();
}

function drawStaticFrame(){
  ctx.clearRect(0,0,W,H);
  drawSky();
  drawBuildingCol(buildingsL,'left');
  drawBuildingCol(buildingsR,'right');
  const roadGrad = ctx.createLinearGradient(ROAD_MARGIN,0,W-ROAD_MARGIN,0);
  roadGrad.addColorStop(0,'#110d24'); roadGrad.addColorStop(0.5,'#1c1732'); roadGrad.addColorStop(1,'#110d24');
  ctx.fillStyle = roadGrad; ctx.fillRect(ROAD_MARGIN,0,roadWidth,H);
  drawGuardrail();
  drawCar(player.x, player.y, '#7bff6b', 0, 1, false);
  drawVignette();
}

function runCountdown(){
  const cd = document.getElementById('countdownOverlay');
  const seq = ['3','2','1','GO!'];
  let i = 0;
  cd.style.display = 'flex';
  Audio_.unlock();
  function step(){
    if(i < seq.length){
      const label = seq[i];
      cd.className = label === 'GO!' ? 'go' : '';
      cd.textContent = label;
      cd.style.animation = 'none';
      void cd.offsetWidth;
      cd.style.animation = 'cdPop .5s cubic-bezier(.34,1.56,.64,1)';
      if(label === 'GO!'){ Audio_.goBeep(); shakeMag = 10; } else { Audio_.countdownBeep(); }
      i++;
      setTimeout(step, label === 'GO!' ? 380 : 620);
    } else {
      cd.style.display = 'none';
      running = true;
      Audio_.startEngine();
      Audio_.startMusic();
      loop();
    }
  }
  step();
}

function spawnObstacle(){
  const lane = Math.floor(Math.random()*laneCount);
  const r = Math.random();
  const type = r < 0.14 ? 'nitro' : (r < 0.26 ? 'coin' : 'car');
  obstacles.push({
    lane, x: laneX(lane), y: -60, type,
    color: type==='car' ? CAR_COLORS[Math.floor(Math.random()*CAR_COLORS.length)] : null
  });
}

function addParticle(p){ particles.push(p); }
function spawnFlame(x,y){
  for(let i=0;i<2;i++){
    addParticle({ x: x+(Math.random()-0.5)*16, y: y+22, vx:(Math.random()-0.5)*1.3, vy: 3.4+Math.random()*2.2,
      life: 18+Math.random()*8, maxLife: 26, size: 6+Math.random()*4, color: Math.random()<0.5 ? '#3dd6ff' : '#ff9f3d' });
  }
}
function spawnSmoke(x,y){
  addParticle({ x, y, vx:(Math.random()-0.5)*0.6, vy: 1+Math.random(), life:22, maxLife:22, size:4+Math.random()*4, color:'rgba(200,200,220,.5)' });
}
function spawnSpark(x,y,color){
  for(let i=0;i<12;i++){
    const a = Math.random()*Math.PI*2;
    addParticle({ x,y, vx:Math.cos(a)*3.4, vy:Math.sin(a)*3.4, life:16, maxLife:16, size:3, color, spark:true });
  }
}

function endGame(){
  running = false;
  Audio_.stopEngine();
  Audio_.stopMusic();
  const distance = Math.floor(score);
  if(distance > bestScore){ bestScore = distance; localStorage.setItem('ok_araba_best_v3', bestScore); }
  document.getElementById('best').textContent = bestScore;
  const won = distance >= 1000;
  document.getElementById('overMsg').textContent = won
    ? `Muhteşem! ${distance} metre ile 3 yıldızı kaptın! 🏆`
    : `${distance} metre gidebildin!`;
  document.querySelector('#overlay .big').textContent = won ? '🏁' : '💥';
  document.getElementById('stars').textContent = starRating(distance, 1000);
  document.getElementById('overlay').style.display = 'flex';
  setTimeout(()=> won ? Audio_.winJingle() : Audio_.loseJingle(), 200);
}

function drawSky(){
  const skyGrad = ctx.createLinearGradient(0,0,0,H);
  skyGrad.addColorStop(0,'#241a4d'); skyGrad.addColorStop(0.5,'#1b1440'); skyGrad.addColorStop(1,'#0c0a1a');
  ctx.fillStyle = skyGrad; ctx.fillRect(0,0,W,H);

  // ay
  ctx.save(); ctx.shadowColor='#e8eefc'; ctx.shadowBlur=20;
  ctx.fillStyle = '#e8eefc'; ctx.beginPath(); ctx.arc(W*0.78, 60, 24, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // yıldızlar (yavaş paralaks)
  farStars.forEach(s=>{
    s.y += 0.15;
    if(s.y > H*0.55) s.y = 0;
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  });

  // uzak gökyüzü çizgisi (siluet dağ/şehir hattı)
  skylineOffset = (skylineOffset + 0.3) % 80;
  ctx.fillStyle = 'rgba(30,22,60,.7)';
  ctx.beginPath(); ctx.moveTo(0, H*0.42);
  for(let x=-80; x<=W+80; x+=40){
    const hgt = H*0.42 - (20 + 30*Math.abs(Math.sin((x+skylineOffset)*0.03)));
    ctx.lineTo(x, hgt);
  }
  ctx.lineTo(W, H*0.42); ctx.closePath(); ctx.fill();

  // hafif sis katmanı (atmosferik derinlik)
  const fog = ctx.createLinearGradient(0,H*0.28,0,H*0.52);
  fog.addColorStop(0,'rgba(130,150,210,.16)'); fog.addColorStop(1,'rgba(130,150,210,0)');
  ctx.fillStyle = fog; ctx.fillRect(0,H*0.26,W,H*0.28);
}

function drawNeonSigns(moveSpeed){
  neonSigns.forEach(s=>{
    s.y += moveSpeed*0.5;
    if(s.y > H+20){ s.y = -20 - Math.random()*60; }
    s.blink += 0.08;
    const alpha = Math.max(0.15, 0.55 + Math.sin(s.blink)*0.35);
    const x = s.side === 'left' ? 14 : W - 14 - s.w;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = s.hue; ctx.shadowBlur = 12;
    ctx.fillStyle = s.hue;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x, s.y, s.w, s.h, 4); else ctx.rect(x, s.y, s.w, s.h);
    ctx.fill();
    ctx.restore();
  });
}

function drawFarLights(moveSpeed){
  if(Math.random() < 0.01 && farLights.length < 6){
    farLights.push({ x: Math.random()<0.5 ? ROAD_MARGIN-16 : W-ROAD_MARGIN+16, y: -10, spd: 2.4+Math.random()*1.6 });
  }
  for(let i=farLights.length-1;i>=0;i--){
    const l = farLights[i];
    l.y += l.spd + moveSpeed*0.3;
    ctx.save();
    ctx.shadowColor = '#fff8c8'; ctx.shadowBlur = 8;
    ctx.fillStyle = 'rgba(255,248,200,.85)';
    ctx.beginPath(); ctx.ellipse(l.x, l.y, 2.4, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    if(l.y > H+20) farLights.splice(i,1);
  }
}

function drawVignette(){
  const g = ctx.createRadialGradient(W/2,H*0.55,H*0.28, W/2,H*0.55,H*0.78);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.42)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
}

function drawBuildingCol(arr, side){
  const bx = side === 'left' ? 8 : W-8;
  arr.forEach(b=>{
    const w = 32;
    const x = side === 'left' ? bx : bx - w;
    const bg = ctx.createLinearGradient(x,0,x+w,0);
    bg.addColorStop(0,'#1a1533'); bg.addColorStop(1,'#241c48');
    ctx.fillStyle = bg;
    ctx.fillRect(x, b.y, w, b.h);
    if(b.lit){
      ctx.fillStyle = `rgba(${b.hue},.55)`;
      for(let wy=b.y+6; wy<b.y+b.h-6; wy+=13){
        ctx.fillRect(x+5, wy, 5, 6);
        ctx.fillRect(x+w-10, wy, 5, 6);
      }
    }
  });
}

function drawGuardrail(){
  guardOffset = (guardOffset + 1) % 46;
  ctx.fillStyle = 'rgba(180,190,220,.5)';
  ctx.fillRect(ROAD_MARGIN-6, 0, 3, H);
  ctx.fillRect(W-ROAD_MARGIN+3, 0, 3, H);
  for(let y = -46+guardOffset; y<H; y+=46){
    ctx.save(); ctx.shadowColor='#ff5c5c'; ctx.shadowBlur=6;
    ctx.fillStyle = '#ff5c5c';
    ctx.beginPath(); ctx.arc(ROAD_MARGIN-4, y, 2.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(W-ROAD_MARGIN+4, y, 2.4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function loop(){
  if(!running) return;
  frameCount++;

  const boosting = nitroActive && nitro > 0;
  if(boosting && !wasBoosting){ Audio_.nitroWhoosh(); }
  wasBoosting = boosting;
  if(boosting){ nitro = Math.max(0, nitro - 1.4); }
  else { nitro = Math.min(100, nitro + 0.22); nitroActive = false; }
  document.getElementById('nitroFill').style.width = nitro + '%';
  document.getElementById('nitroBtn').classList.toggle('active', boosting);
  document.getElementById('speedWrap').classList.toggle('boostGlow', boosting);

  const curSpeed = speed + (boosting ? 5.5 : 0);
  speed = 3.6 + score*0.0035;
  score += curSpeed*0.08;
  document.getElementById('score').textContent = Math.floor(score);
  const speedKmh = Math.round(curSpeed*38);
  const speedEl = document.getElementById('speedNum');
  if(speedEl.textContent !== String(speedKmh)){
    speedEl.textContent = speedKmh;
  }
  document.getElementById('raceProgress').style.width = Math.min(100, (score/1000)*100) + '%';

  const speedRatio = Math.min(1, curSpeed/14);
  Audio_.updateEngine(speedRatio, boosting);

  roadOffset = (roadOffset + curSpeed) % 44;

  shakeMag = Math.max(shakeMag*0.85, boosting ? 1.1 : 0);
  const sx = (Math.random()-0.5)*shakeMag, sy = (Math.random()-0.5)*shakeMag;

  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(sx, sy);

  // nitro sırasında hafif FOV/zoom hissi
  const zoom = boosting ? 1.035 : 1;
  if(zoom !== 1){
    ctx.translate(W/2, H/2); ctx.scale(zoom, zoom); ctx.translate(-W/2, -H/2);
  }

  drawSky();

  buildingsL.forEach(b=> b.y += curSpeed*0.5);
  buildingsR.forEach(b=> b.y += curSpeed*0.5);
  buildingsL.forEach(b=>{ if(b.y>H+100){ b.y = -100-Math.random()*80; b.h=50+Math.random()*110; b.lit=Math.random()<0.6; }});
  buildingsR.forEach(b=>{ if(b.y>H+100){ b.y = -100-Math.random()*80; b.h=50+Math.random()*110; b.lit=Math.random()<0.6; }});
  drawBuildingCol(buildingsL,'left');
  drawBuildingCol(buildingsR,'right');
  drawNeonSigns(curSpeed);
  drawFarLights(curSpeed);

  // yol (asfalt dokusu ile)
  const roadGrad = ctx.createLinearGradient(ROAD_MARGIN,0,W-ROAD_MARGIN,0);
  roadGrad.addColorStop(0,'#110d24'); roadGrad.addColorStop(0.5,'#1c1732'); roadGrad.addColorStop(1,'#110d24');
  ctx.fillStyle = roadGrad;
  ctx.fillRect(ROAD_MARGIN,0,roadWidth,H);

  drawGuardrail();

  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 4; ctx.setLineDash([20,20]);
  for(let i=1;i<laneCount;i++){
    ctx.beginPath(); ctx.moveTo(ROAD_MARGIN+laneW*i, roadOffset-44); ctx.lineTo(ROAD_MARGIN+laneW*i, H); ctx.stroke();
  }
  ctx.setLineDash([]);

  if(boosting){
    ctx.strokeStyle = 'rgba(124,233,255,.55)'; ctx.lineWidth = 2;
    for(let i=0;i<6;i++){
      const lx = ROAD_MARGIN+10 + Math.random()*(roadWidth-20);
      ctx.beginPath(); ctx.moveTo(lx, Math.random()*H); ctx.lineTo(lx, Math.random()*H + 46); ctx.stroke();
    }
  }

  spawnTimer -= 1;
  if(spawnTimer <= 0){ spawnObstacle(); spawnTimer = Math.max(24, 55 - score*0.05); }

  player.tilt += (player.targetTilt - player.tilt) * 0.2;
  player.bob = Math.sin(frameCount*0.2) * Math.min(2.2, curSpeed*0.18) * (boosting?1.5:1);

  if(boosting) spawnFlame(player.x, player.y);
  if(Math.random()<0.25) spawnSmoke(player.x + (Math.random()<0.5?-12:12), player.y+24);

  // hareket izi (nitro sırasında)
  if(boosting){
    trail.push({ x: player.x, y: player.y, tilt: player.tilt, life: 10 });
  }
  for(let i=trail.length-1;i>=0;i--){
    const t = trail[i]; t.life--;
    if(t.life<=0){ trail.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha = (t.life/10)*0.25;
    drawCar(t.x, t.y+ (10-t.life)*4, '#7bff6b', t.tilt, 0.4, false, 1);
    ctx.restore();
  }

  ctx.font='24px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=obstacles.length-1;i>=0;i--){
    const o = obstacles[i];
    o.y += curSpeed + 1.2;
    if(o.type==='car'){
      drawCar(o.x, o.y, o.color, 0, 0.7, false);
    } else if(o.type==='coin'){
      ctx.save(); ctx.shadowColor='#ffd23f'; ctx.shadowBlur=10;
      ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(o.x,o.y,12,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#a8790a'; ctx.font='13px sans-serif'; ctx.fillText('₺',o.x,o.y+1);
      ctx.restore();
    } else if(o.type==='nitro'){
      ctx.save(); ctx.shadowColor='#3dd6ff'; ctx.shadowBlur=14;
      ctx.font='24px serif'; ctx.fillText('⚡', o.x, o.y);
      ctx.restore();
    }
    if(Math.abs(o.x - player.x) < 32 && Math.abs(o.y - player.y) < 46){
      if(o.type==='coin'){ score += 25; Audio_.coin(); spawnSpark(o.x,o.y,'#ffd23f'); obstacles.splice(i,1); continue; }
      if(o.type==='nitro'){ nitro = Math.min(100, nitro+40); Audio_.pickupNitro(); spawnSpark(o.x,o.y,'#3dd6ff'); obstacles.splice(i,1); continue; }
      shakeMag = 16;
      spawnSpark(player.x, player.y, '#ff5c5c');
      Audio_.crash();
      endGame();
      ctx.restore();
      return;
    }
    if(o.y > H+60) obstacles.splice(i,1);
  }

  if(particles.length > 140) particles.splice(0, particles.length - 140);
  for(let i=particles.length-1;i>=0;i--){    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    const alpha = Math.max(0, p.life/p.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    if(p.spark){ ctx.shadowColor=p.color; ctx.shadowBlur=6; }
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*alpha+1,0,Math.PI*2); ctx.fill();
    ctx.restore();
    if(p.life<=0) particles.splice(i,1);
  }

  drawCar(player.x, player.y + player.bob, '#7bff6b', player.tilt, boosting ? 1.7 : 1, true);

  drawVignette();

  ctx.restore();
  raf = requestAnimationFrame(loop);
}
let raf;

function moveLane(dir){
  if(!running) return;
  player.lane = Math.max(0, Math.min(laneCount-1, player.lane + dir));
  player.x = laneX(player.lane);
  player.targetTilt = dir * 0.28;
  setTimeout(()=>{ player.targetTilt = 0; }, 220);
  playClick(500);
}
function setNitro(on){
  if(!running) return;
  nitroActive = on && nitro > 4;
  if(on) shakeMag = Math.max(shakeMag, 3);
}

document.getElementById('leftBtn').onclick = ()=>moveLane(-1);
document.getElementById('rightBtn').onclick = ()=>moveLane(1);
const nitroBtn = document.getElementById('nitroBtn');
nitroBtn.addEventListener('mousedown', ()=>setNitro(true));
nitroBtn.addEventListener('mouseup', ()=>setNitro(false));
nitroBtn.addEventListener('mouseleave', ()=>setNitro(false));
nitroBtn.addEventListener('touchstart', e=>{ e.preventDefault(); setNitro(true); }, {passive:false});
nitroBtn.addEventListener('touchend', e=>{ e.preventDefault(); setNitro(false); }, {passive:false});

window.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft' && !keysHeld.left){ keysHeld.left=true; moveLane(-1); }
  if(e.key==='ArrowRight' && !keysHeld.right){ keysHeld.right=true; moveLane(1); }
  if(e.key==='Shift' || e.key===' ') setNitro(true);
});
window.addEventListener('keyup', e=>{
  if(e.key==='ArrowLeft') keysHeld.left=false;
  if(e.key==='ArrowRight') keysHeld.right=false;
  if(e.key==='Shift' || e.key===' ') setNitro(false);
});
let touchStartX = null;
canvas.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; });
canvas.addEventListener('touchend', e=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(dx > 30) moveLane(1); else if(dx < -30) moveLane(-1);
  touchStartX = null;
});

// Sessize alma butonu
const muteBtn = document.getElementById('muteBtn');
muteBtn.textContent = Audio_.isMuted() ? '🔇' : '🔊';
muteBtn.addEventListener('click', ()=>{
  Audio_.setMuted(!Audio_.isMuted());
  muteBtn.textContent = Audio_.isMuted() ? '🔇' : '🔊';
  if(!Audio_.isMuted() && running){ Audio_.startEngine(); Audio_.startMusic(); }
});

// iOS/Safari: ilk gerçek kullanıcı etkileşiminde ses kilidini aç
['touchstart','click','keydown'].forEach(evt=>
  window.addEventListener(evt, ()=> Audio_.unlock(), { once:true, passive:true })
);

// Sekme arka plana alınınca döngüyü ve sesi durdur (performans/pil)
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    if(raf) cancelAnimationFrame(raf);
    Audio_.stopEngine(); Audio_.stopMusic();
  } else if(running){
    Audio_.startEngine(); Audio_.startMusic();
    loop();
  }
});

startGame();
</script>
</body>
