<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Araba Yarışı — Oyun Kutusu</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  canvas{background:#5b5b6e; border-radius:20px; box-shadow:0 10px 30px rgba(27,27,58,.3); touch-action:none;}
  #wrap{position:relative;}
  .controls{display:flex; gap:14px; margin-top:14px;}
  .ctl{width:70px; height:56px; border:none; border-radius:16px; background:var(--purple); color:#fff; font-size:1.6rem; box-shadow:0 4px 0 var(--purple-dark); cursor:pointer;}
  .ctl:active{transform:translateY(3px); box-shadow:0 1px 0 var(--purple-dark);}
  p.hint{font-size:.85rem; opacity:.7; margin-top:8px; text-align:center; max-width:320px;}
</style>
</head>
<body>
  <a class="back" href="index.html">← Oyunlara dön</a>
  <h1>🏎️ Araba Yarışı</h1>
  <div id="hud"><span>🚗 Mesafe: <span id="score">0</span> m</span><span>🏆 Rekor: <span id="best">0</span> m</span></div>
  <div id="wrap">
    <canvas id="c" width="320" height="480"></canvas>
    <div id="overlay">
      <div class="big">💥</div>
      <div class="msg" id="overMsg"></div>
      <div class="stars" id="stars"></div>
      <button class="btn" onclick="startGame()">Tekrar Oyna</button>
      <a class="btn alt" href="index.html" style="text-decoration:none; display:inline-block;">Oyunlara Dön</a>
    </div>
  </div>
  <div class="controls">
    <button class="ctl" id="leftBtn">←</button>
    <button class="ctl" id="rightBtn">→</button>
  </div>
  <p class="hint">Ok tuşları veya butonlarla şerit değiştir, diğer arabalara çarpma!</p>

<script src="common.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const laneCount = 3;
const laneW = W / laneCount;
const laneX = i => laneW*i + laneW/2;

let bestScore = parseInt(localStorage.getItem('ok_araba_best') || '0', 10);
document.getElementById('best').textContent = bestScore;

let player, obstacles, score, speed, running, spawnTimer, roadOffset;

function startGame(){
  player = { lane: 1, x: laneX(1), y: H-90, w: 40, h: 62 };
  obstacles = [];
  score = 0; speed = 3.2; running = true; roadOffset = 0;
  document.getElementById('score').textContent = 0;
  document.getElementById('overlay').style.display = 'none';
  spawnTimer = 0;
  loop();
}

function spawnObstacle(){
  const lane = Math.floor(Math.random()*laneCount);
  const type = Math.random() < 0.15 ? 'coin' : 'car';
  obstacles.push({ lane, x: laneX(lane), y: -60, w: 40, h: 60, type, emoji: type==='coin' ? '🪙' : ['🚙','🚌','🚕','🚓'][Math.floor(Math.random()*4)] });
}

function endGame(){
  running = false;
  const distance = Math.floor(score);
  if(distance > bestScore){
    bestScore = distance;
    localStorage.setItem('ok_araba_best', bestScore);
  }
  document.getElementById('best').textContent = bestScore;
  document.getElementById('overMsg').textContent = `${distance} metre gidebildin!`;
  document.getElementById('stars').textContent = starRating(distance, 800);
  document.getElementById('overlay').style.display = 'flex';
  playError();
}

function loop(){
  if(!running) return;
  // road scroll
  roadOffset = (roadOffset + speed) % 40;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#5b5b6e';
  ctx.fillRect(0,0,W,H);
  // lane dashes
  ctx.strokeStyle = 'rgba(255,255,255,.5)';
  ctx.lineWidth = 4;
  ctx.setLineDash([18,18]);
  for(let i=1;i<laneCount;i++){
    ctx.beginPath();
    ctx.moveTo(laneW*i, roadOffset - 40);
    ctx.lineTo(laneW*i, H);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // speed increases with score
  speed = 3.2 + score*0.004;
  score += speed*0.08;
  document.getElementById('score').textContent = Math.floor(score);

  spawnTimer -= 1;
  if(spawnTimer <= 0){
    spawnObstacle();
    spawnTimer = Math.max(28, 55 - score*0.05);
  }

  ctx.font = '40px serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(let i=obstacles.length-1;i>=0;i--){
    const o = obstacles[i];
    o.y += speed + 1.2;
    ctx.fillText(o.emoji, o.x, o.y);
    // collision check
    if(Math.abs(o.x - player.x) < 34 && Math.abs(o.y - player.y) < 46){
      if(o.type === 'coin'){
        score += 25;
        playTone(700,0.1,'triangle',0.15);
        obstacles.splice(i,1);
        continue;
      } else {
        endGame();
        return;
      }
    }
    if(o.y > H+50) obstacles.splice(i,1);
  }

  // player car
  ctx.fillText('🚗', player.x, player.y);

  raf = requestAnimationFrame(loop);
}
let raf;

function moveLane(dir){
  if(!running) return;
  player.lane = Math.max(0, Math.min(laneCount-1, player.lane + dir));
  player.x = laneX(player.lane);
  playClick(500);
}

document.getElementById('leftBtn').onclick = ()=>moveLane(-1);
document.getElementById('rightBtn').onclick = ()=>moveLane(1);
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') moveLane(-1);
  if(e.key==='ArrowRight') moveLane(1);
});
let touchStartX = null;
canvas.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; });
canvas.addEventListener('touchend', e=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(dx > 30) moveLane(1); else if(dx < -30) moveLane(-1);
  touchStartX = null;
});

startGame();
</script>
</body>
</html>
