<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hafıza Eşleştirme</title>
<style>
  :root{ --bg:#F7F5FF; --ink:#1B1B3A; --purple:#6C4EF5; --coral:#FF6B6B; --yellow:#FFD23F; --teal:#2EC4B6; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 80% 10%, #FFF3D6, var(--bg) 60%);
    font-family:'Nunito',system-ui,sans-serif; color:var(--ink); padding:16px;
  }
  h1{font-size:1.6rem; margin:0 0 8px;}
  a.back{color:var(--purple); font-weight:800; text-decoration:none; align-self:flex-start; margin-bottom:6px;}
  #hud{display:flex; gap:16px; margin-bottom:12px; font-weight:800;}
  #hud span{background:#fff; padding:6px 14px; border-radius:999px; box-shadow:0 3px 0 #ddd;}
  #grid{display:grid; grid-template-columns:repeat(4, 74px); grid-gap:10px;}
  .card{
    width:74px; height:74px; border-radius:14px; background:var(--purple); display:flex; align-items:center; justify-content:center;
    font-size:2rem; cursor:pointer; box-shadow:0 4px 0 #4a34c9; user-select:none; transition:transform .15s;
  }
  .card.flipped, .card.matched{ background:#fff; box-shadow:0 4px 0 #ddd; transform:scale(1.03); }
  .card.matched{ background:var(--teal); box-shadow:0 4px 0 #1c9c90; }
  #win{display:none; margin-top:16px; text-align:center; font-weight:900; font-size:1.2rem;}
  #win button{margin-top:8px; background:var(--coral); border:none; color:#fff; font-weight:800; padding:10px 22px; border-radius:999px; font-size:1rem; cursor:pointer; box-shadow:0 4px 0 #c94b4b;}
</style>
</head>
<body>
  <a class="back" href="index.html">← Oyunlara dön</a>
  <h1>🧠 Hafıza Eşleştirme</h1>
  <div id="hud"><span>👀 Hamle: <span id="moves">0</span></span><span>✅ Eşleşen: <span id="found">0</span>/8</span></div>
  <div id="grid"></div>
  <div id="win">
    <div>🎉 Tebrikler, tüm çiftleri buldun!</div>
    <button onclick="init()">Tekrar Oyna</button>
  </div>

<script>
const emojis = ['🐱','🐶','🐰','🦊','🐻','🐼','🦁','🐸'];
let deck, flipped, matched, moves, lock;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function init(){
  deck = shuffle([...emojis, ...emojis]).map((e,i)=>({id:i, emoji:e, flipped:false, matched:false}));
  flipped = []; matched = 0; moves = 0; lock = false;
  document.getElementById('moves').textContent = 0;
  document.getElementById('found').textContent = 0;
  document.getElementById('win').style.display = 'none';
  render();
}

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  deck.forEach(card=>{
    const div = document.createElement('div');
    div.className = 'card' + (card.flipped||card.matched ? (card.matched ? ' matched':' flipped') : '');
    div.textContent = (card.flipped||card.matched) ? card.emoji : '❓';
    div.onclick = ()=>flip(card.id);
    grid.appendChild(div);
  });
}

function flip(id){
  if(lock) return;
  const card = deck.find(c=>c.id===id);
  if(card.flipped || card.matched) return;
  card.flipped = true;
  flipped.push(card);
  render();
  if(flipped.length===2){
    moves++;
    document.getElementById('moves').textContent = moves;
    lock = true;
    setTimeout(()=>{
      const [a,b] = flipped;
      if(a.emoji===b.emoji){
        a.matched = true; b.matched = true; matched++;
        document.getElementById('found').textContent = matched;
        if(matched===emojis.length){
          document.getElementById('win').style.display = 'block';
        }
      } else {
        a.flipped = false; b.flipped = false;
      }
      flipped = [];
      lock = false;
      render();
    }, 700);
  }
}

init();
</script>
</body>
</html>
