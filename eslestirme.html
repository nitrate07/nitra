<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="description" content="Aynı kartları bul, hafızanı güçlendir! Çocuklar için ücretsiz eşleştirme hafıza oyunu.">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  #grid{display:grid; gap:10px;}
  .flip-outer{width:70px; height:70px;}
  .flip-front{background:linear-gradient(135deg,var(--purple),#8f7bff); box-shadow:0 4px 0 var(--purple-dark); color:#fff;}
  .flip-back{background:#fff; box-shadow:0 4px 0 #ddd;}
  .flip-outer.matched .flip-back{background:var(--teal); box-shadow:0 4px 0 var(--teal-dark);}
</style>
</head>
<body>
  <a class="back" href="index.html">← Oyunlara dön</a>
  <h1 id="title">🧠 Eşleştirme</h1>
  <div id="hud"><span>👀 Hamle: <span id="moves">0</span></span><span>✅ Eşleşen: <span id="found">0</span>/<span id="total">0</span></span></div>
  <div class="panel">
    <div id="grid"></div>
    <div id="overlay">
      <div class="big">🎉</div>
      <div class="msg">Tüm çiftleri buldun!</div>
      <div class="stars" id="stars"></div>
      <button class="btn" onclick="init()">Tekrar Oyna</button>
      <a class="btn alt" href="index.html" style="text-decoration:none; display:inline-block;">Oyunlara Dön</a>
    </div>
  </div>

<script src="common.js"></script>
<script>
const { theme, level } = getParams();
setTitle('Eşleştirme');
document.getElementById('title').textContent = `🧠 ${theme.name} Eşleştirme`;

const pairsCount = Math.min(theme.emojis.length, 3 + level * 2);
const cols = pairsCount <= 6 ? 4 : 5;
document.getElementById('grid').style.gridTemplateColumns = `repeat(${cols}, 70px)`;
document.getElementById('total').textContent = pairsCount;
const parMoves = Math.round(pairsCount * 1.6);

let deck, flipped, matched, moves, lock;

function init(){
  const chosen = shuffle(theme.emojis).slice(0, pairsCount);
  deck = shuffle([...chosen, ...chosen]).map((e,i)=>({id:i, emoji:e, flipped:false, matched:false}));
  flipped = []; matched = 0; moves = 0; lock = false;
  document.getElementById('moves').textContent = 0;
  document.getElementById('found').textContent = 0;
  document.getElementById('overlay').style.display = 'none';
  render(true);
}

function render(rebuild){
  const grid = document.getElementById('grid');
  if(rebuild){
    grid.innerHTML = '';
    deck.forEach(card=>{
      const outer = document.createElement('div');
      outer.className = 'cell flip-outer pop';
      outer.id = 'card-' + card.id;
      outer.innerHTML = `
        <div class="flip-inner">
          <div class="flip-front">❓</div>
          <div class="flip-back">${card.emoji}</div>
        </div>`;
      outer.onclick = ()=>flip(card.id);
      grid.appendChild(outer);
    });
  } else {
    deck.forEach(card=>{
      const outer = document.getElementById('card-' + card.id);
      outer.classList.toggle('is-flipped', card.flipped || card.matched);
      outer.classList.toggle('matched', card.matched);
    });
  }
}

function flip(id){
  if(lock) return;
  const card = deck.find(c=>c.id===id);
  if(card.flipped || card.matched) return;
  card.flipped = true;
  flipped.push(card);
  playClick(500);
  render(false);
  if(flipped.length===2){
    moves++;
    document.getElementById('moves').textContent = moves;
    lock = true;
    setTimeout(()=>{
      const [a,b] = flipped;
      if(a.emoji===b.emoji){
        a.matched = true; b.matched = true; matched++;
        document.getElementById('found').textContent = matched;
        playSuccess();
        document.getElementById('card-'+a.id).classList.add('glow');
        document.getElementById('card-'+b.id).classList.add('glow');
        if(matched===pairsCount){
          const score = Math.max(0, pairsCount * 3 - Math.max(0, moves - parMoves));
          document.getElementById('stars').textContent = starRating(score, pairsCount * 3);
          document.getElementById('overlay').style.display = 'flex';
          fireConfetti(document.querySelector('.panel'));
        }
      } else {
        a.flipped = false; b.flipped = false;
        playError();
        document.getElementById('card-'+a.id).classList.add('shake');
        document.getElementById('card-'+b.id).classList.add('shake');
        setTimeout(()=>{
          document.getElementById('card-'+a.id)?.classList.remove('shake');
          document.getElementById('card-'+b.id)?.classList.remove('shake');
        }, 350);
      }
      flipped = [];
      lock = false;
      render(false);
    }, 700);
  }
}

init();
</script>
</body>
</html>
