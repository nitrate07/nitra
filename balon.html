<body>
  <a class="back" href="index.html">← Oyunlara dön</a>
  <h1>🎈 Balon Patlatma</h1>
  <div id="hud">
    <span>🎈 Skor: <span id="score">0</span></span>
    <span id="comboBadge" class="combo-badge" style="display:none;"></span>
    <span>⏱️ <span id="time">30</span> sn</span>

  </div>

      <div class="big">🎈</div>
      <div class="msg" id="overMsg"></div>
      <div class="result-grid" id="resultGrid"></div>
      <div class="stars" id="stars"></div>
      <button class="btn" onclick="startGame()">Tekrar Oyna</button>
      <a class="btn alt" href="index.html" style="text-decoration:none; display:inline-block;">Oyunlara Dön</a>
    </div>
  </div>
  <p class="hint">Havaya yükselen renk cümbüşü balonları patlat, ama gözünü dört aç: 💣 bombaya asla dokunma!</p>

<script src="common.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Retina/yuksek DPI netligi: mantiksal oyun boyutu (W x H) degismiyor, sadece
// canvas'in gercek piksel arka bellegi ekran yogunluguna gore buyutuluyor ve
// tum cizimler ctx.scale ile bu olcege otomatik uyduruluyor.
const DPR = Math.min(window.devicePixelRatio || 1, 2.5);
canvas.width = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);
const COLORS = ['🎈','🔴','🟡','🟢','🔵','🟣'];

let bestScore = parseInt(localStorage.getItem('ok_balon_best') || '0', 10);
document.getElementById('best').textContent = bestScore;

let balloons, score, timeLeft, running, spawnTimer, timerInt, raf;
let particles, shaker, combo;

function spawnBalloon(){
  const isBomb = Math.random() < 0.16;
  balloons.push({
    x: 30 + Math.random()*(W-60), y: H+30,
    r: 22 + Math.random()*8,
    speed: 1.4 + Math.random()*1.6 + (30-timeLeft)*0.02,
    emoji: isBomb ? '💣' : COLORS[Math.floor(Math.random()*COLORS.length)],
    bomb: isBomb, popped: false, popT: 0
  });
}

function startGame(){
  balloons = []; score = 0; timeLeft = 30; running = false; spawnTimer = 0;
  particles = []; shaker = createShaker(); combo = createCombo();
  document.getElementById('score').textContent = 0;
  document.getElementById('time').textContent = timeLeft;
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('comboBadge').style.display = 'none';
  if(timerInt) clearInterval(timerInt);
  ctx.clearRect(0,0,W,H);
  runCountdown(document.getElementById('countdownOverlay'), ()=>{
    running = true;
    timerInt = setInterval(()=>{
      timeLeft--;
      document.getElementById('time').textContent = timeLeft;
      if(timeLeft<=0) endGame();
    }, 1000);
    loop();
  });
}

function endGame(){
  running = false;
  clearInterval(timerInt);
  cancelAnimationFrame(raf);
  if(score > bestScore){ bestScore = score; localStorage.setItem('ok_balon_best', bestScore); }
  document.getElementById('best').textContent = bestScore;
  document.getElementById('overMsg').textContent = `Bu turda ${score} puan kazandın!`;
  renderResultGrid('resultGrid', [['PUAN', score], ['REKOR', bestScore], ['EN İYİ COMBO', 'x'+combo.level]]);
  document.getElementById('stars').textContent = starRating(score, 400);
  showOverlay('overlay', score >= 250 ? {celebrate:true} : undefined);
  if(score >= 250) fireConfetti(document.getElementById('wrap'), {big:true});
  playSuccess();
}

function loop(){
  if(!running) return;
  combo.tick();
  const sh = shaker.tick();
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(sh.x, sh.y);

  ctx.fillStyle = 'rgba(255,255,255,.4)';
  [[50,60],[240,140],[150,300]].forEach(([cx,cy])=>{
    ctx.beginPath(); ctx.ellipse(cx,cy,22,11,0,0,Math.PI*2); ctx.fill();
  });

  spawnTimer -= 1;
  if(spawnTimer <= 0){ spawnBalloon(); spawnTimer = Math.max(16, 34 - (30-timeLeft)); }

  ctx.font = '34px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=balloons.length-1;i>=0;i--){
    const b = balloons[i];
    if(b.popped){
      b.popT += 1;
      ctx.save(); ctx.globalAlpha = Math.max(0,1-b.popT/12); ctx.font = `${34+b.popT*3}px serif`;
      ctx.fillText('✨', b.x, b.y); ctx.restore();
      if(b.popT > 12) balloons.splice(i,1);
      continue;
    }
    b.y -= b.speed;
    ctx.fillText(b.emoji, b.x, b.y);
    if(b.y < -40) balloons.splice(i,1);
  }

  updateParticles(ctx, particles);
  ctx.restore();
  raf = requestAnimationFrame(loop);
}

function handleTap(cx, cy){
  if(!running) return;
  for(let i=balloons.length-1;i>=0;i--){
    const b = balloons[i];
    if(b.popped) continue;
    if(Math.hypot(cx-b.x, cy-b.y) < b.r+8){
      if(b.bomb){
        playError();
        score = Math.max(0, score-15);
        combo.reset();
        document.getElementById('comboBadge').style.display = 'none';
        shaker.trigger(9);
        spawnParticles(particles, b.x, b.y, 10, ['#666','#333'], {speed:4, life:20});
      } else {
        const level = combo.register();
        renderComboBadge('comboBadge', level);
        const gained = 10 * level;
        playTone(600+Math.random()*300,0.1,'triangle',0.15);
        if(level>1) playCombo(level);
        score += gained;
        spawnParticles(particles, b.x, b.y, 10, ['#FFD23F','#FF6EC7','#3dd6ff','#7bff6b'], {speed:3.5, life:22});
        const pr = document.getElementById('wrap').getBoundingClientRect(), r = canvas.getBoundingClientRect();
        showFloatingPoints(document.getElementById('wrap'), (r.left-pr.left)+b.x*(r.width/W), (r.top-pr.top)+b.y*(r.height/H),
          level>1 ? `🔥 x${level} +${gained}` : `+${gained}`, level>1 ? '#FF9F43' : '#2EC4B6');
      }
      document.getElementById('score').textContent = score;
      b.popped = true; b.popT = 0;
      break;
    }
  }
}

canvas.addEventListener('click', e=>{
  const rect = canvas.getBoundingClientRect();
  handleTap((e.clientX-rect.left)*(W/rect.width), (e.clientY-rect.top)*(H/rect.height));
});
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const t = e.touches[0];
  handleTap((t.clientX-rect.left)*(W/rect.width), (t.clientY-rect.top)*(H/rect.height));
}, {passive:false});

startGame();

initFullscreenButton('fsBtn', document.getElementById('wrap'));
initLandscapeHint();
</script>
