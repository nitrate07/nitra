<!DOCTYPE html>

<link rel="stylesheet" href="common.css">
<style>
  body{
    background:radial-gradient(circle at 50% 0%, var(--th-bg1,#F7F5FF), var(--th-bg2,#EDE9FF) 70%);
    padding-top:max(14px, env(safe-area-inset-top)); padding-bottom:max(14px, env(safe-area-inset-bottom));
  }
  #grid{display:grid; gap:6px;}
  .tile{background:linear-gradient(135deg,var(--th-1,var(--purple)),var(--th-2,#8f7bff)); color:#fff; box-shadow:0 4px 0 var(--th-2,var(--purple-dark)); font-size:1.8rem; transition:transform .1s;}
  .tile:active{ transform:scale(.94); }
  .tile.empty{background:transparent; box-shadow:none; cursor:default;}
  #refRow{display:flex; gap:4px; margin-bottom:10px; background:var(--th-bg2,#F1EEFF); padding:8px 10px; border-radius:12px;}
  #refRow span{font-size:1.1rem;}
  #muteCtl{
    position:fixed; top:14px; right:14px; width:42px; height:42px; border:none; border-radius:12px;
    background:#fff; color:var(--ink); font-size:1.1rem; box-shadow:0 3px 0 #ddd; cursor:pointer; z-index:5;
  }
  #muteCtl:active{ transform:translateY(2px); }
  #countdownOverlay{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(255,255,255,.85); border-radius:20px; z-index:9;
  }
</style>
</head>
<body>
  <a class="back" href="index.html">← Oyunlara dön</a>
  <h1 id="title">🧩 Kaydırmalı Bulmaca</h1>
  <div id="hud"><span>👋 Hamle: <span id="moves">0</span></span></div>
  <div id="refRow"><span>Hedef sıra:</span><span id="refIcons"></span></div>
  <div class="panel" style="position:relative;">
    <div id="grid"></div>
    <div id="countdownOverlay"></div>
    <div id="overlay">
      <div class="big">🎉</div>
      <div class="msg">Bulmacayı çözdün!</div>
      <div class="result-grid" id="resultGrid"></div>
      <div class="stars" id="stars"></div>
      <button class="btn" onclick="init()">Tekrar Oyna</button>
      <a class="btn alt" href="index.html" style="text-decoration:none; display:inline-block;">Oyunlara Dön</a>
    </div>
  </div>
  <button id="muteCtl">🔊</button>

<script src="common.js"></script>
<script>
const { theme, level } = getParams();
setTitle('Kaydırmalı Bulmaca');
document.getElementById('title').textContent = `🧩 ${theme.name} Kaydırmalı Bulmaca`;
document.documentElement.style.setProperty('--th-1', theme.hue1);
document.documentElement.style.setProperty('--th-2', theme.hue2);
document.documentElement.style.setProperty('--th-bg1', theme.bg1);
document.documentElement.style.setProperty('--th-bg2', theme.bg2);

let muted = localStorage.getItem('ok_kaydirma_muted') === '1';
const muteCtl = document.getElementById('muteCtl');
muteCtl.textContent = muted ? '🔇' : '🔊';
muteCtl.addEventListener('click', ()=>{
  muted = !muted; localStorage.setItem('ok_kaydirma_muted', muted?'1':'0');
  muteCtl.textContent = muted?'🔇':'🔊';
});
function snd(fn){ if(!muted) fn(); }
let started = false;

const size = [null,3,3,4,4][level];
const total = size*size;
const tileSize = size <= 3 ? 84 : 66;
document.getElementById('grid').style.gridTemplateColumns = `repeat(${size}, ${tileSize}px)`;

const icons = shuffle(theme.emojis).slice(0, total - 1); // boş kutu hariç
document.getElementById('refIcons').textContent = icons.join(' ');
const parMoves = total * 6;

let tiles, emptyIndex, moves;

function isSolvable(arr){
  // basit kontrol: ters sıralama sayısını çift yapmak için gerekirse iki taşı takas et
  let inv = 0;
  const flat = arr.filter(v=>v!==null);
  for(let i=0;i<flat.length;i++) for(let j=i+1;j<flat.length;j++) if(flat[i]>flat[j]) inv++;
  return inv % 2 === 0;
}

function init(){
  let arr = [...Array(total-1).keys(), null];
  arr = shuffle(arr);
  if(!isSolvable(arr)){
    // ilk iki taşı takas et (null olmayan)
    const i0 = arr.findIndex(v=>v!==null);
    let i1 = arr.findIndex((v,i)=>v!==null && i!==i0);
    [arr[i0], arr[i1]] = [arr[i1], arr[i0]];
  }
  tiles = arr;
  emptyIndex = tiles.indexOf(null);
  moves = 0; started = false;
  document.getElementById('moves').textContent = 0;
  document.getElementById('overlay').style.display = 'none';
  render();
  const cd = document.getElementById('countdownOverlay');
  cd.style.display = 'flex';
  runCountdown(cd, ()=>{ cd.style.display = 'none'; started = true; });
}

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  tiles.forEach((val, idx)=>{
    const div = document.createElement('div');
    div.className = 'cell tile' + (val===null ? ' empty' : '');
    div.style.width = tileSize+'px';
    div.style.height = tileSize+'px';
    div.textContent = val===null ? '' : icons[val];
    div.onclick = ()=>tryMove(idx);
    grid.appendChild(div);
  });
}

function tryMove(idx){
  if(!started) return;
  const r1 = Math.floor(idx/size), c1 = idx%size;
  const r2 = Math.floor(emptyIndex/size), c2 = emptyIndex%size;
  const adjacent = (Math.abs(r1-r2)+Math.abs(c1-c2)) === 1;
  if(!adjacent) return;
  [tiles[idx], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[idx]];
  emptyIndex = idx;
  moves++;
  document.getElementById('moves').textContent = moves;
  snd(()=>playClick(480));
  render();
  const solved = tiles.every((v,i)=> i===total-1 ? v===null : v===i);
  if(solved){
    snd(playSuccess);
    const score = Math.max(0, total*3 - Math.max(0, moves - parMoves));
    renderResultGrid('resultGrid', [['HAMLE', moves], ['SEVİYE', LEVEL_NAMES[level]]]);
    document.getElementById('stars').textContent = starRating(score, total*3);
    showOverlay('overlay');
    fireConfetti(document.querySelector('.panel'));
  }
}

init();
</script>
</body>
</html>
