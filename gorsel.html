  <div id="hud"><span>📣 <span id="status">Hazırlan, gözlerini dört aç!</span></span></div>

<script src="common.js"></script>
<script>
let { theme, level } = getParams();
let pendingLevel = level;
setTitle('Görsel Hafıza');
document.getElementById('title').textContent = `👁️ ${theme.name} Görsel Hafıza`;
document.documentElement.style.setProperty('--th-1', theme.hue1);
document.documentElement.style.setProperty('--th-2', theme.hue2);
document.documentElement.style.setProperty('--th-bg1', theme.bg1);
document.documentElement.style.setProperty('--th-bg2', theme.bg2);

let muted = localStorage.getItem('ok_gorsel_muted') === '1';
const muteCtl = document.getElementById('muteCtl');
muteCtl.textContent = muted ? '🔇' : '🔊';
muteCtl.addEventListener('click', ()=>{
  muted = !muted; localStorage.setItem('ok_gorsel_muted', muted?'1':'0');
  muteCtl.textContent = muted?'🔇':'🔊';
});
function snd(fn){ if(!muted) fn(); }

let size, totalCells, itemCount, studyTime, itemIcons, positions, answerSet, cells;
let picked = new Set();
let answered = false;
const gridEl = document.getElementById('grid');

function init(){
  // Adaptif zorluk: bir önceki turda ayarlanan seviye burada devreye girer
  // (bkz. dosyanın altındaki "Tekrar Oyna" -> playAgain()).
  level = pendingLevel;
  size = [null,3,4,4,5][level];
  totalCells = size*size;
  itemCount = Math.min(theme.emojis.length, Math.round(totalCells * 0.35) + level);
  studyTime = 2500 + level*400;

  document.getElementById('grid').style.gridTemplateColumns = `repeat(${size}, 64px)`;

  itemIcons = shuffle(theme.emojis).slice(0, itemCount);
  positions = shuffle([...Array(totalCells).keys()]).slice(0, itemCount);
  answerSet = new Set(positions);

  cells = [];
  gridEl.innerHTML = '';
  for(let i=0;i<totalCells;i++){
    const div = document.createElement('div');
    div.className = 'cell gcell pop';
    div.style.animationDelay = (Math.random()*0.2)+'s';
    gridEl.appendChild(div);
    cells.push(div);
  }
  positions.forEach((pos, idx)=>{
    cells[pos].textContent = itemIcons[idx];
    cells[pos].classList.add('show');
  });
  picked = new Set();
  answered = false;
  document.getElementById('confirmBtn').style.display = 'none';
  document.getElementById('studyBar').style.width = '100%';
  document.getElementById('overlay').style.display = 'none';

  const cd = document.getElementById('countdownOverlay');
  cd.style.display = 'flex';
  document.getElementById('status').textContent = 'Hazırlan, gözlerini dört aç!';
  runCountdown(cd, ()=>{
    cd.style.display = 'none';
    beginStudyPhase();
  });
}

function beginStudyPhase(){
  document.getElementById('status').textContent = `İyi bak ve ezberle! (${Math.round(studyTime/1000)} sn)`;
  const startTime = Date.now();
  const barTimer = setInterval(()=>{
    const pct = Math.max(0, 100 - ((Date.now()-startTime)/studyTime)*100);
    document.getElementById('studyBar').style.width = pct + '%';
    if(pct<=0) clearInterval(barTimer);
  }, 50);

  setTimeout(()=>{
    cells.forEach(c=>{ c.textContent=''; c.classList.remove('show'); });
    document.getElementById('status').textContent = `Az önce simge olan ${itemCount} kutuyu bulup seç!`;
    document.getElementById('confirmBtn').style.display = 'inline-block';
    cells.forEach((c,i)=>{
      c.onclick = ()=>{
        if(answered) return;
        snd(()=>playClick(460));
        if(picked.has(i)){ picked.delete(i); c.classList.remove('picked'); }
        else { picked.add(i); c.classList.add('picked'); }
      };
    });
  }, studyTime);
}

document.getElementById('confirmBtn').onclick = ()=>{
  if(answered) return;
  answered = true;
  let correct = 0;
  cells.forEach((c,i)=>{
    const shouldPick = answerSet.has(i);
    const wasPicked = picked.has(i);
    if(shouldPick && wasPicked){ c.classList.add('correct','glow'); c.textContent='✓'; correct++; }
    else if(!shouldPick && wasPicked){ c.classList.add('wrong','shake'); c.textContent='✗'; }
    else if(shouldPick && !wasPicked){ c.classList.add('wrong'); c.textContent='?'; }
  });
  const success = correct === itemCount;
  snd(()=> success ? playSuccess() : playError());
  // Adaptif zorluk: bu turdaki doğru oranına göre bir sonraki turun seviyesini ayarla.
  const performanceRatio = itemCount > 0 ? correct / itemCount : 0;
  pendingLevel = computeAdaptiveLevel(level, performanceRatio);
  setTimeout(()=>{
    document.getElementById('overIcon').textContent = success ? '🎉' : '💪';
    document.getElementById('overMsg').textContent = `${itemCount} kutudan tam ${correct} tanesini doğru hatırladın!`;
    renderResultGrid('resultGrid', [['DOĞRU', correct+'/'+itemCount], ['SEVİYE', LEVEL_NAMES[level]]]);
    document.getElementById('stars').textContent = starRating(correct, itemCount);
    showAdaptiveNote(document.getElementById('overlay'), level, pendingLevel);
    showOverlay('overlay', success ? {celebrate:true} : undefined);
    if(success) fireConfetti(document.querySelector('.panel'), {big:true});
  }, 900);
};

function playAgain(){ init(); }

init();

initFullscreenButton('fsBtn', document.querySelector('.panel'));
</script>
