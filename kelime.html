<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelime Hafızası — Oyun Kutusu</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  #memList{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:340px; margin-bottom:10px;}
  .word-chip{background:var(--yellow); padding:10px 16px; border-radius:12px; font-weight:800;}
  #choices{display:grid; grid-template-columns:repeat(2, 140px); gap:10px;}
  .choice{
    background:#fff; border:3px solid #E4DDFF; border-radius:14px; padding:12px; font-weight:800; text-align:center;
  }
  .choice.correct{background:var(--teal); color:#fff; border-color:var(--teal-dark);}
  .choice.wrong{background:var(--coral); color:#fff; border-color:var(--coral-dark);}
  .choice.missed{background:#FFE8A3; border-color:var(--yellow);}
</style>
</head>
<body>
  <a class="back" href="index.html">← Oyunlara dön</a>
  <h1 id="title">📝 Kelime Hafızası</h1>
  <div id="hud"><span>📣 <span id="status">Kelimeleri ezberle!</span></span></div>
  <div class="panel">
    <div id="memList"></div>
    <div id="choices" style="display:none;"></div>
    <div id="overlay">
      <div class="big" id="overIcon">🎉</div>
      <div class="msg" id="overMsg"></div>
      <button class="btn" onclick="location.reload()">Tekrar Oyna</button>
      <a class="btn alt" href="index.html" style="text-decoration:none; display:inline-block;">Oyunlara Dön</a>
    </div>
  </div>

<script src="common.js"></script>
<script>
const { theme, level } = getParams();
setTitle('Kelime Hafızası');
document.getElementById('title').textContent = `📝 ${theme.name} Kelime Hafızası`;

const wordCount = Math.min(theme.words.length, 3 + level); // 4,5,6,7
const studyTime = 3 + level; // seconds to memorize

const chosenWords = shuffle(theme.words).slice(0, wordCount);
const distractorPool = theme.words.filter(w=>!chosenWords.includes(w));
const distractors = shuffle(distractorPool).slice(0, wordCount);
const allChoices = shuffle([...chosenWords, ...distractors]);

const memList = document.getElementById('memList');
chosenWords.forEach(w=>{
  const chip = document.createElement('div');
  chip.className = 'word-chip';
  chip.textContent = w;
  memList.appendChild(chip);
});

let timeLeft = studyTime;
document.getElementById('status').textContent = `Ezberle: ${timeLeft} sn`;
const countdown = setInterval(()=>{
  timeLeft--;
  if(timeLeft <= 0){
    clearInterval(countdown);
    showChoices();
  } else {
    document.getElementById('status').textContent = `Ezberle: ${timeLeft} sn`;
  }
}, 1000);

let selected = new Set();
let answered = false;

function showChoices(){
  memList.style.display = 'none';
  document.getElementById('status').textContent = 'Hangileri gösterildi? Seç ve onayla!';
  const choicesEl = document.getElementById('choices');
  choicesEl.style.display = 'grid';
  allChoices.forEach(w=>{
    const div = document.createElement('div');
    div.className = 'choice';
    div.textContent = w;
    div.onclick = ()=>{
      if(answered) return;
      if(selected.has(w)){ selected.delete(w); div.style.outline='none'; }
      else { selected.add(w); div.style.outline='3px solid var(--purple)'; }
    };
    div.dataset.word = w;
    choicesEl.appendChild(div);
  });
  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'btn';
  confirmBtn.style.gridColumn = '1 / -1';
  confirmBtn.textContent = 'Onayla';
  confirmBtn.onclick = checkAnswers;
  choicesEl.appendChild(confirmBtn);
}

function checkAnswers(){
  if(answered) return;
  answered = true;
  let correct = 0;
  document.querySelectorAll('.choice').forEach(div=>{
    const w = div.dataset.word;
    if(!w) return;
    const wasShown = chosenWords.includes(w);
    const wasSelected = selected.has(w);
    if(wasShown && wasSelected){ div.classList.add('correct'); correct++; }
    else if(!wasShown && wasSelected){ div.classList.add('wrong'); }
    else if(wasShown && !wasSelected){ div.classList.add('missed'); }
  });
  setTimeout(()=>{
    const overlay = document.getElementById('overlay');
    const success = correct === wordCount;
    document.getElementById('overIcon').textContent = success ? '🎉' : '💪';
    document.getElementById('overMsg').textContent = `${wordCount} kelimeden ${correct} tanesini doğru hatırladın!`;
    overlay.style.display = 'flex';
  }, 900);
}
</script>
</body>
</html>
