  <div id="hud">
    <span>📏 Yükseklik: <span id="score">0</span> m</span>
    <span id="comboBadge" class="combo-badge" style="display:none;"></span>

      <button class="btn" onclick="startGame()">Tekrar Oyna</button>
      <a class="btn alt" href="index.html" style="text-decoration:none; display:inline-block;">Oyunlara Dön</a>
    </div>
  </div>
  <p class="hint">Fareni ya da parmağını sağa sola kaydırarak platformdan platforma zıpla ve kulenin zirvesine doğru durmadan tırman!</p>

<script src="common.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Retina/yuksek DPI netligi: mantiksal oyun boyutu (W x H) degismiyor, sadece
// canvas'in gercek piksel arka bellegi ekran yogunluguna gore buyutuluyor ve
// tum cizimler ctx.scale ile bu olcege otomatik uyduruluyor.
const DPR = Math.min(window.devicePixelRatio || 1, 2.5);
canvas.width = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);
const GRAVITY = 0.32;
const JUMP_V = -10.5;

let bestScore = parseInt(localStorage.getItem('ok_merdiven_best') || '0', 10);
document.getElementById('best').textContent = bestScore;

let player, platforms, score, running, targetX, raf, particles, shaker, combo;

function makePlatform(y){ return { x: 20+Math.random()*(W-100), y, w:70, h:14, star: Math.random()<0.22 }; }

function startGame(){
  player = { x:W/2, y:H-60, vy:JUMP_V, r:18 };
  targetX = player.x; platforms=[];
  let y=H-30; while(y>-40){ platforms.push(makePlatform(y)); y -= 55+Math.random()*25; }
  score=0; running=false;
  particles = []; shaker = createShaker(); combo = createCombo(70);
  document.getElementById('score').textContent=0;
  document.getElementById('overlay').style.display='none';
  document.getElementById('comboBadge').style.display='none';
  ctx.clearRect(0,0,W,H);
  runCountdown(document.getElementById('countdownOverlay'), ()=>{ running = true; loop(); });
}
function endGame(){
  running=false;
  const s=Math.floor(score/8);
  if(s>bestScore){ bestScore=s; localStorage.setItem('ok_merdiven_best', bestScore); }
  document.getElementById('best').textContent=bestScore;
  document.getElementById('overMsg').textContent=`Muhteşem bir tırmanış! Kulede tam ${s} metre yükseldin.`;
  renderResultGrid('resultGrid', [['YÜKSEKLİK', s+' m'], ['REKOR', bestScore+' m'], ['EN İYİ SERİ', 'x'+combo.level]]);
  document.getElementById('stars').textContent=starRating(s,300);
  showOverlay('overlay', s >= 250 ? {celebrate:true} : undefined);
  if(s >= 250) fireConfetti(document.getElementById('wrap'), {big:true});
  playError();
}
function loop(){
  if(!running) return;
  combo.tick();
  const sh = shaker.tick();
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(sh.x, sh.y);
  ctx.fillStyle='rgba(255,255,255,.12)';
  [[40,60],[240,140],[120,280]].forEach(([bx,by])=>{ ctx.fillRect(bx-14, (by+score*0.15)%(H+60)-30, 28, 40); });

  player.vy += GRAVITY; player.y += player.vy;
  player.x += (targetX-player.x)*0.18;
  if(player.x<-10) player.x=W+10; if(player.x>W+10) player.x=-10;

  if(player.vy>0){
    for(const p of platforms){
      if(player.y+player.r>p.y && player.y+player.r<p.y+p.h+14 && player.x>p.x-10 && player.x<p.x+p.w+10){
        player.vy = JUMP_V; playClick(480);
        spawnParticles(particles, player.x, p.y, 5, ['#e0c9a0','#fff'], {speed:2, life:14});
        if(p.star){
          const level = combo.register();
          renderComboBadge('comboBadge', level);
          const gained = 80*level;
          score+=gained; p.star=false; playTone(700,0.1,'triangle',0.15);
          if(level>1) playCombo(level);
          spawnParticles(particles, p.x+p.w/2, p.y-10, 10, ['#FFD23F','#FF9F5A'], {speed:3.5, life:20});
          const pr = document.getElementById('wrap').getBoundingClientRect(), r = canvas.getBoundingClientRect();
          showFloatingPoints(document.getElementById('wrap'), (r.left-pr.left)+(p.x+p.w/2)*(r.width/W), (r.top-pr.top)+p.y*(r.height/H),
            level>1 ? `🔥 x${level}` : '⭐', '#FFD23F');
        }
        break;
      }
    }
  }
  if(player.y < H*0.42){
    const delta = H*0.42-player.y; player.y = H*0.42;
    platforms.forEach(p=>p.y+=delta); score+=delta;
    document.getElementById('score').textContent = Math.floor(score/8);
  }
  platforms = platforms.filter(p=>p.y<H+30);
  while(platforms.length<9){ const minY=Math.min(...platforms.map(p=>p.y),0); platforms.push(makePlatform(minY-(55+Math.random()*25))); }

  platforms.forEach(p=>{
    ctx.fillStyle = p.star ? '#ffd23f' : '#e0c9a0';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(p.x,p.y,p.w,p.h,6) : ctx.rect(p.x,p.y,p.w,p.h); ctx.fill();
    if(p.star){ ctx.font='16px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('⭐',p.x+p.w/2,p.y-10); }
  });
  ctx.font='38px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🧗', player.x, player.y);

  updateParticles(ctx, particles);
  ctx.restore();

  if(player.y>H+30){ shaker.trigger(12); endGame(); return; }
  raf = requestAnimationFrame(loop);
}
function setTargetX(clientX){ const rect=canvas.getBoundingClientRect(); targetX=(clientX-rect.left)*(W/rect.width); }
canvas.addEventListener('mousemove', e=>setTargetX(e.clientX));
canvas.addEventListener('touchmove', e=>{ e.preventDefault(); setTargetX(e.touches[0].clientX); }, {passive:false});
window.addEventListener('keydown', e=>{ if(e.key==='ArrowLeft') targetX=Math.max(0,targetX-60); if(e.key==='ArrowRight') targetX=Math.min(W,targetX+60); });
startGame();

initFullscreenButton('fsBtn', document.getElementById('wrap'));
initLandscapeHint();
</script>
