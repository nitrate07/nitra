<body>
  <a class="back" href="index.html">← Oyunlara dön</a>
  <h1>🤸 İp Atlama</h1>
  <div id="hud">
    <span>🔢 Atlama: <span id="score">0</span></span>
    <span id="comboBadge" class="combo-badge" style="display:none;"></span>
    <span>❌ Kaçırılan: <span id="misses">0</span>/3</span>
    <span>🏆 <span id="best">0</span></span>
  </div>

  <div class="panel" style="display:flex; flex-direction:column; align-items:center; position:relative;">

    <canvas id="c" width="320" height="360"></canvas>
    <div id="countdownOverlay"></div>
    <div id="overlay">
      <div class="big">😿</div>
      <div class="msg" id="overMsg"></div>
      <div class="result-grid" id="resultGrid"></div>
      <div class="stars" id="stars"></div>
      <button class="btn" onclick="startGame()">Tekrar Oyna</button>
      <a class="btn alt" href="index.html" style="text-decoration:none; display:inline-block;">Oyunlara Dön</a>
    </div>
  </div>
  <p class="hint">İp tam yere değmek üzereyken (yeşil bölgeye girdiği an) tıkla ya da boşluk tuşuna bas ve tam zamanında zıpla! Erken kalkarsan, geç kalırsan ya da hiç zıplamazsan ipe takılırsın.</p>

<script src="common.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Retina/yuksek DPI netligi: mantiksal oyun boyutu (W x H) degismiyor, sadece
// canvas'in gercek piksel arka bellegi ekran yogunluguna gore buyutuluyor ve
// tum cizimler ctx.scale ile bu olcege otomatik uyduruluyor.
const DPR = Math.min(window.devicePixelRatio || 1, 2.5);
canvas.width = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);
const GROUND_Y = H - 80;

let score, misses, running, cyclePos, cycleSpeed, jumping, jumpV, charY, judged, best;
let particles, shaker, combo;
best = parseInt(localStorage.getItem('ok_ipatlama_best') || '0', 10);
document.getElementById('best').textContent = best;

// ---- Oyun döngüsü: 0 -> 1 arası ilerleyen tek bir "ip turu" ----
// 0.85 - 1.0 arası ip ayakların hizasından geçiyor (bu aralıkta zıplamak GEREKİYOR)
const SAFE_START = 0.84, SAFE_END = 1.0;

function startGame(){
  score = 0; misses = 0; running = false; cyclePos = 0; cycleSpeed = 0.0095; jumping=false; jumpV=0; charY=0; judged=false;
  particles = []; shaker = createShaker(); combo = createCombo(150);
  document.getElementById('score').textContent = 0;
  document.getElementById('misses').textContent = 0;
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('comboBadge').style.display = 'none';
  document.getElementById('zoneSafe').style.left = (SAFE_START*100)+'%';
  document.getElementById('zoneSafe').style.width = ((SAFE_END-SAFE_START)*100)+'%';
  drawScene();
  runCountdown(document.getElementById('countdownOverlay'), ()=>{ running = true; loop(); });
}

function endGame(){
  running = false;
  if(score > best){ best = score; localStorage.setItem('ok_ipatlama_best', best); }
  document.getElementById('best').textContent = best;
  document.getElementById('overMsg').textContent = `Üst üste tam ${score} kez atladın, ne güzel bir ritim tuttun!`;
  renderResultGrid('resultGrid', [['ATLAMA', score], ['REKOR', best], ['EN İYİ SERİ', 'x'+combo.level]]);
  document.getElementById('stars').textContent = starRating(score, 20);
  showOverlay('overlay', score >= 15 ? {celebrate:true} : undefined);
  if(score >= 15) fireConfetti(document.querySelector('.panel'), {big:true});
}

function drawScene(){
  const sh = shaker.tick();
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(sh.x, sh.y);
  ctx.fillStyle = '#fff3d6'; ctx.fillRect(-4,-4,W+8,H+8);
  ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0,GROUND_Y+26); ctx.lineTo(W,GROUND_Y+26); ctx.stroke();

  // ip: cyclePos 0->1 boyunca yayın en üstten (uzakta) yere (yakında) inişini gösterir
  const ropeHeight = 110 * (1 - Math.pow(Math.abs(cyclePos-0.5)*2, 1));
  const ropeY = GROUND_Y + 10 - ropeHeight;
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 5; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(W/2-95, GROUND_Y+10);
  ctx.quadraticCurveTo(W/2, ropeY, W/2+95, GROUND_Y+10);
  ctx.stroke();

  // zıplama fiziği
  if(jumping){
    jumpV += 0.85; charY += jumpV;
    if(charY >= 0){ charY = 0; jumping = false; jumpV = 0; }
  }
  ctx.font='44px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🧒', W/2, GROUND_Y-16+charY);

  updateParticles(ctx, particles);
  ctx.restore();

  document.getElementById('zoneMarker').style.left = `calc(${cyclePos*100}% - 7px)`;
}

function loop(){
  if(!running) return;
  cyclePos += cycleSpeed;

  if(cyclePos >= 1){
    if(!judged){ registerMiss(); }
    cyclePos = 0;
    judged = false;
    cycleSpeed = Math.min(0.019, cycleSpeed + 0.0006);
  }

  drawScene();
  raf = requestAnimationFrame(loop);
}
let raf;

function registerMiss(){
  misses++;
  combo.reset();
  document.getElementById('comboBadge').style.display = 'none';
  document.getElementById('misses').textContent = misses;
  shaker.trigger(8);
  spawnParticles(particles, W/2, GROUND_Y-16, 8, ['#ff6b6b','#c94b4b'], {speed:3, life:16});
  playError();
  if(misses >= 3){ endGame(); }
}

function registerSuccess(){
  const level = combo.register();
  renderComboBadge('comboBadge', level);
  score++;
  document.getElementById('score').textContent = score;
  playTone(600 + Math.min(400, score*8), 0.09, 'triangle', 0.14);
  if(level>1) playCombo(level);
  spawnParticles(particles, W/2, GROUND_Y-16, 8, ['#7bff6b','#FFD23F'], {speed:2.8, life:16});
  if(level>1){
    const r = canvas.getBoundingClientRect(), pr = document.querySelector('.panel').getBoundingClientRect();
    showFloatingPoints(document.querySelector('.panel'), (r.left-pr.left)+W/2, (r.top-pr.top)+GROUND_Y-40, `🔥 x${level}`, '#FF9F43');
  }
}

function doJump(){
  if(!running || jumping) return;
  jumping = true; jumpV = -12.5;

  const inSafeZone = cyclePos >= SAFE_START - 0.06 && cyclePos <= SAFE_END + 0.03;
  if(inSafeZone && !judged){
    judged = true;
    registerSuccess();
  } else if(!judged){
    judged = true;
    registerMiss();
  }
}

canvas.addEventListener('click', doJump);
canvas.addEventListener('touchstart', e=>{ e.preventDefault(); doJump(); }, {passive:false});
window.addEventListener('keydown', e=>{ if(e.key===' '){ e.preventDefault(); doJump(); } });

startGame();

initFullscreenButton('fsBtn', document.querySelector('.panel'));
initLandscapeHint();
</script>
