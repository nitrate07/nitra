<body>
  <a class="back" href="index.html">← Oyunlara dön</a>
  <h1>🍕 Pizza Fırını</h1>
  <div id="hud">
    <span>🍕 Skor: <span id="score">0</span></span>
    <span id="comboBadge" class="combo-badge" style="display:none;"></span>
    <span>🏆 Mükemmel: <span id="perfect">0</span></span>
    <span>⭐ Rekor: <span id="best">0</span></span>
  </div>
  <div id="stageText">Hazırlanıyor...</div>
  <div id="wrap">
    <button id="fsBtn" class="fs-btn">⛶</button>
    <canvas id="c" width="300" height="120"></canvas>
    <div id="countdownOverlay"></div>
    <div id="overlay">
      <div class="big">🍕</div>
      <div class="msg" id="overMsg"></div>
      <div class="result-grid" id="resultGrid"></div>
      <div class="stars" id="stars"></div>
      <button class="btn" onclick="startGame()">Tekrar Oyna</button>
      <a class="btn alt" href="index.html" style="text-decoration:none; display:inline-block;">Oyunlara Dön</a>
    </div>
  </div>
  <p class="hint">İbre yeşil bölgeye girdiği anda dokun! Sos sürme, peynir serpme ve fırınlama aşamalarını doğru zamanlayarak nefis bir pizza çıkar.</p>

<script src="common.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Retina/yuksek DPI netligi: mantiksal oyun boyutu (W x H) degismiyor, sadece
// canvas'in gercek piksel arka bellegi ekran yogunluguna gore buyutuluyor ve
// tum cizimler ctx.scale ile bu olcege otomatik uyduruluyor.
const DPR = Math.min(window.devicePixelRatio || 1, 2.5);
canvas.width = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);

const STAGES = [
  { name: 'Sos sür 🍅', emoji: '🍅' },
  { name: 'Peynir serp 🧀', emoji: '🧀' },
  { name: 'Fırında pişir 🔥', emoji: '🔥' }
];

let bestScore = parseInt(localStorage.getItem('ok_pizza_best') || '0', 10);
document.getElementById('best').textContent = bestScore;

let score = 0, perfect = 0, pizzaCount = 0, stageIdx = 0, needleX, dir, zoneStart, zoneW, running, raf;
let particles, shaker, combo;

function newZone(){
  zoneW = Math.max(30, 70 - pizzaCount*3);
  zoneStart = 20 + Math.random()*(W-40-zoneW);
}

function startGame(){
  score = 0; perfect = 0; pizzaCount = 0; stageIdx = 0; running = false;
  particles = []; shaker = createShaker(); combo = createCombo();
  document.getElementById('score').textContent = 0;
  document.getElementById('perfect').textContent = 0;
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('comboBadge').style.display = 'none';
  startStage();
  ctx.clearRect(0,0,W,H);
  runCountdown(document.getElementById('countdownOverlay'), ()=>{ running = true; loop(); });
}

function startStage(){
  needleX = 10; dir = 1;
  newZone();
  document.getElementById('stageText').textContent = `Pizza ${pizzaCount+1} — ${STAGES[stageIdx].name}`;
}

function endGame(){
  running = false;
  cancelAnimationFrame(raf);
  if(score > bestScore){ bestScore = score; localStorage.setItem('ok_pizza_best', bestScore); }
  document.getElementById('best').textContent = bestScore;
  document.getElementById('overMsg').textContent = `${score} puan topladın, ${perfect} tanesi mükemmel pizza!`;
  renderResultGrid('resultGrid', [['PUAN', score], ['MÜKEMMEL', perfect+'/8'], ['REKOR', bestScore]]);
  document.getElementById('stars').textContent = starRating(perfect, 8);
  showOverlay('overlay', perfect >= 6 ? {celebrate:true} : undefined);
  if(perfect >= 6) fireConfetti(document.getElementById('wrap'), {big:true});
  playSuccess();
}

function loop(){
  if(!running) return;
  const sh = shaker.tick();
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(sh.x, sh.y);
  ctx.fillStyle = '#241608'; ctx.fillRect(-4,-4,W+8,H+8);

  const barY = H/2;
  ctx.fillStyle = '#4a3220'; ctx.fillRect(10, barY-10, W-20, 20);
  ctx.fillStyle = '#4caf50'; ctx.fillRect(zoneStart, barY-10, zoneW, 20);

  needleX += dir * (2.2 + pizzaCount*0.15);
  if(needleX > W-10){ needleX = W-10; dir = -1; }
  if(needleX < 10){ needleX = 10; dir = 1; }

  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(needleX-2, barY-18, 4, 36);

  ctx.font = '22px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(STAGES[stageIdx].emoji, W/2, 24);

  updateParticles(ctx, particles);
  ctx.restore();
  raf = requestAnimationFrame(loop);
}

function handleTap(){
  if(!running) return;
  const inZone = needleX >= zoneStart && needleX <= zoneStart+zoneW;
  const centerDist = Math.abs(needleX - (zoneStart+zoneW/2));
  const pr = document.getElementById('wrap').getBoundingClientRect(), r = canvas.getBoundingClientRect();
  const fx = (r.left-pr.left)+needleX*(r.width/W), fy = (r.top-pr.top)+(H/2)*(r.height/H);
  if(inZone){
    const isPerfect = centerDist < zoneW*0.25;
    const level = combo.register();
    renderComboBadge('comboBadge', level);
    const gained = (isPerfect ? 15 : 8) * (isPerfect ? level : 1);
    score += gained;
    spawnParticles(particles, needleX, H/2, isPerfect?10:6, isPerfect?['#FFD23F','#7bff6b']:['#7bff6b'], {speed:3.5, life:20});
    showFloatingPoints(document.getElementById('wrap'), fx, fy, `+${gained}${isPerfect?' 🎯':''}`, isPerfect?'#FFD23F':'#7bff6b');
    if(isPerfect) playTone(750,0.12,'triangle',0.15); else playTone(600,0.1,'triangle',0.13);
    if(level>1 && isPerfect) playCombo(level);
  } else {
    combo.reset();
    document.getElementById('comboBadge').style.display = 'none';
    shaker.trigger(7);
    spawnParticles(particles, needleX, H/2, 6, ['#8a5a3a'], {speed:2.5, life:14});
    playError();
  }
  document.getElementById('score').textContent = score;

  stageIdx++;
  if(stageIdx >= STAGES.length){
    pizzaCount++;
    if(inZone) perfect++;
    document.getElementById('perfect').textContent = perfect;
    playSuccess();
    stageIdx = 0;
    if(pizzaCount >= 8){ endGame(); return; }
  }
  startStage();
}

canvas.addEventListener('click', handleTap);
canvas.addEventListener('touchstart', e=>{ e.preventDefault(); handleTap(); }, {passive:false});

startGame();

initFullscreenButton('fsBtn', document.getElementById('wrap'));
initLandscapeHint();
</script>
