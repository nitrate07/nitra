<link rel="stylesheet" href="common.css">
<style>
  body{ background:radial-gradient(circle at 50% 0%, #3a2416, #140d08 70%); }
  h1{ color:#fff; text-shadow:0 0 14px #ffb04d; font-family:'Orbitron','Baloo 2',sans-serif; }
  a.back{ color:#ffcf9b; }
  #hud span{ background:rgba(30,18,10,.85); color:#fff; box-shadow:0 0 0 1px rgba(255,176,77,.3), 0 3px 0 #000; font-family:'Fredoka',sans-serif; }
  canvas{background:#241608; border-radius:20px; box-shadow:0 0 0 2px rgba(255,176,77,.3), 0 18px 50px rgba(0,0,0,.65); touch-action:none;}
  #wrap{position:relative;}
  .controls{display:flex; gap:12px; margin-top:14px;}
  .ctl{width:64px; height:54px; border:none; border-radius:14px; background:#3a2a14; color:#ffcf9b; font-size:1.4rem;
    box-shadow:0 0 0 1px rgba(255,176,77,.35), 0 4px 0 #000; cursor:pointer;}
  .ctl:active{transform:translateY(3px);}
  #jumpBtn{background:linear-gradient(180deg,#ff9f3d,#ff3d6e); color:#fff; font-weight:900; box-shadow:0 0 14px rgba(255,159,61,.6), 0 4px 0 #7a2a12;}
  #nitroBtn.active{ animation:nitroGlow2 .3s ease-in-out infinite alternate; }
  @keyframes nitroGlow2{ from{ box-shadow:0 0 0 1px rgba(255,176,77,.35), 0 4px 0 #000;} to{ box-shadow:0 0 20px rgba(255,176,77,.85), 0 4px 0 #000;} }
  #nitroBar{ width:100%; max-width:280px; height:12px; background:#2a1c0e; border-radius:999px; overflow:hidden; margin:0 auto 10px; box-shadow:inset 0 0 0 1px rgba(255,176,77,.3); }
  #nitroFill{ height:100%; background:linear-gradient(90deg,#ff9f3d,#ffd23f); border-radius:999px; transition:width .1s linear; }
  #overlay{ background:rgba(20,13,8,.95); }
  p.hint{ font-size:.82rem; opacity:.6; margin-top:8px; text-align:center; max-width:340px; color:#e0c7ae;}
</style>
</head>
<body>
  <a class="back" href="index.html">← Oyunlara dön</a>
  <h1>🏍️ Gece Motor Yarışı</h1>
  <div id="hud"><span>📍 <span id="score">0</span> m</span><span>⚡ <span id="speedNum">0</span> km/s</span><span>🏆 <span id="best">0</span> m</span></div>
  <div id="nitroBar"><div id="nitroFill" style="width:100%"></div></div>
  <div id="wrap">
    <canvas id="c" width="380" height="600"></canvas>
    <div id="overlay">
      <div class="big">💥</div>
      <div class="msg" id="overMsg"></div>
      <div class="stars" id="stars"></div>
      <button class="btn" onclick="startGame()">Tekrar Oyna</button>
      <a class="btn alt" href="index.html" style="text-decoration:none; display:inline-block;">Oyunlara Dön</a>
    </div>
  </div>
  <div class="controls">
    <button class="ctl" id="leftBtn">◀</button>
    <button class="ctl" id="jumpBtn">⬆</button>
    <button class="ctl" id="rightBtn">▶</button>
  </div>
  <button class="btn alt" id="nitroBtn" style="margin-top:10px;">🔥 NİTRO</button>
  <p class="hint">Şerit değiştir, taşlara zıpla, yağdan kaç, ⚡ toplayıp NİTRO ile fırla!</p>

<script src="common.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const laneCount = 3;
const ROAD_MARGIN = 36;
const roadWidth = W - ROAD_MARGIN*2;
const laneW = roadWidth / laneCount;
const laneX = i => ROAD_MARGIN + laneW*i + laneW/2;
const groundY = H - 120;

let bestScore = parseInt(localStorage.getItem('ok_motor_best_v3') || '0', 10);
document.getElementById('best').textContent = bestScore;

// ---- Detaylı motosiklet çizimi ----
function drawBike(x,y,tilt=0,boost=false,jumping=false){
  ctx.save();
  ctx.translate(x,y); ctx.rotate(tilt);

  // gölge (zıplarken küçülür)
  ctx.save();
  ctx.globalAlpha = jumping ? 0.15 : 0.32;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0, 30, jumping ? 12 : 20, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  if(boost){ ctx.shadowColor='#ff9f3d'; ctx.shadowBlur=22; }

  // arka teker
  ctx.strokeStyle = '#111'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(-13, 18, 9, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(-13,18,3,0,Math.PI*2); ctx.fill();
  // ön teker
  ctx.beginPath(); ctx.arc(13, 18, 9, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(13,18,3,0,Math.PI*2); ctx.fill();

  // gövde (motor)
  ctx.fillStyle = '#ff3d6e';
  ctx.beginPath();
  ctx.moveTo(-16,10); ctx.lineTo(-4,-8); ctx.lineTo(10,-10); ctx.lineTo(16,4); ctx.lineTo(6,12); ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.moveTo(-4,-8); ctx.lineTo(10,-10); ctx.lineTo(8,-4); ctx.lineTo(-2,-2); ctx.closePath(); ctx.fill();

  // egzoz parlaması
  if(boost){
    ctx.fillStyle = 'rgba(255,159,61,.8)';
    ctx.beginPath(); ctx.ellipse(-20, 14, 6, 3, 0.3, 0, Math.PI*2); ctx.fill();
  }

  // sürücü (kask + gövde)
  ctx.fillStyle = '#2b2b40';
  ctx.beginPath(); ctx.ellipse(-2, -6, 6, 9, -0.3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3D6EFF';
  ctx.beginPath(); ctx.arc(-2, -18, 7, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(180,230,255,.85)';
  ctx.beginPath(); ctx.arc(0, -18, 3.4, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

let player, obstacles, particles, dust, score, speed, running, spawnTimer, roadOffset, raf, nitro, nitroActive, shakeMag, torches, duneOffset;

function makeTorches(){
  const arr = [];
  let y = -50;
  while(y < H+100){ arr.push({y}); y += 80+Math.random()*50; }
  return arr;
}

function startGame(){
  player = { lane: 1, x: laneX(1), y: groundY, jumping: false, jumpV: 0, tilt:0, targetTilt:0 };
  obstacles = []; particles = []; dust = [];
  score = 0; speed = 3.8; running = true; roadOffset = 0; spawnTimer = 0; duneOffset = 0;
  nitro = 100; nitroActive = false; shakeMag = 0;
  torches = makeTorches();
  document.getElementById('score').textContent = 0;
  document.getElementById('overlay').style.display = 'none';
  loop();
}

function spawnObstacle(){
  const lane = Math.floor(Math.random()*laneCount);
  const r = Math.random();
  const type = r < 0.12 ? 'nitro' : (r < 0.4 ? 'rock' : 'oil');
  obstacles.push({ lane, x: laneX(lane), y: -60, type });
}

function endGame(){
  running = false;
  const distance = Math.floor(score);
  if(distance > bestScore){ bestScore = distance; localStorage.setItem('ok_motor_best_v3', bestScore); }
  document.getElementById('best').textContent = bestScore;
  document.getElementById('overMsg').textContent = `${distance} metre gidebildin!`;
  document.getElementById('stars').textContent = starRating(distance, 900);
  document.getElementById('overlay').style.display = 'flex';
  playError();
}

function drawSky(){
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#4a2f18'); sky.addColorStop(0.5,'#3a2416'); sky.addColorStop(1,'#140d08');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);

  // ay
  ctx.save(); ctx.shadowColor='#ffe0b0'; ctx.shadowBlur=22;
  ctx.fillStyle = '#ffe8c8'; ctx.beginPath(); ctx.arc(W*0.2, 55, 22, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // uzak kum tepeleri siluet
  duneOffset = (duneOffset + 0.25) % 90;
  ctx.fillStyle = 'rgba(60,38,18,.7)';
  ctx.beginPath(); ctx.moveTo(0, H*0.4);
  for(let x=-90; x<=W+90; x+=45){
    const hgt = H*0.4 - (14 + 26*Math.abs(Math.sin((x+duneOffset)*0.025)));
    ctx.lineTo(x, hgt);
  }
  ctx.lineTo(W, H*0.4); ctx.closePath(); ctx.fill();
}

function loop(){
  if(!running) return;
  const boosting = nitroActive && nitro > 0;
  if(boosting) nitro = Math.max(0, nitro-1.4); else { nitro = Math.min(100, nitro+0.22); nitroActive=false; }
  document.getElementById('nitroFill').style.width = nitro+'%';
  document.getElementById('nitroBtn').classList.toggle('active', boosting);

  const curSpeed = speed + (boosting ? 5 : 0);
  speed = 3.8 + score*0.004;
  score += curSpeed*0.08;
  document.getElementById('score').textContent = Math.floor(score);
  document.getElementById('speedNum').textContent = Math.round(curSpeed*36);

  roadOffset = (roadOffset + curSpeed) % 40;
  shakeMag *= 0.85;
  const sx=(Math.random()-0.5)*shakeMag, sy=(Math.random()-0.5)*shakeMag;

  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(sx,sy);

  drawSky();

  torches.forEach(t=>{ t.y += curSpeed*0.5; if(t.y>H+30){ t.y=-30-Math.random()*60; } });
  torches.forEach(t=>{
    ctx.save(); ctx.shadowColor='#ffb04d'; ctx.shadowBlur=16;
    ctx.fillStyle='#ffb04d'; ctx.beginPath(); ctx.arc(16,t.y,4.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(W-16,t.y,4.5,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(80,50,20,.8)';
    ctx.fillRect(14, t.y+4, 4, 16); ctx.fillRect(W-18, t.y+4, 4, 16);
  });

  const roadGrad = ctx.createLinearGradient(ROAD_MARGIN,0,W-ROAD_MARGIN,0);
  roadGrad.addColorStop(0,'#1c1108'); roadGrad.addColorStop(0.5,'#2e1c0f'); roadGrad.addColorStop(1,'#1c1108');
  ctx.fillStyle = roadGrad;
  ctx.fillRect(ROAD_MARGIN,0,roadWidth,H);

  ctx.strokeStyle = 'rgba(255,176,77,.4)'; ctx.lineWidth=3; ctx.setLineDash([16,16]);
  for(let i=1;i<laneCount;i++){
    ctx.beginPath(); ctx.moveTo(ROAD_MARGIN+laneW*i, roadOffset-40); ctx.lineTo(ROAD_MARGIN+laneW*i, H); ctx.stroke();
  }
  ctx.setLineDash([]);

  let playerY = player.y;
  if(player.jumping){
    player.jumpV -= 1.4; playerY -= player.jumpV;
    if(playerY >= groundY){
      playerY = groundY; player.jumping=false; player.jumpV=0;
      for(let i=0;i<8;i++) dust.push({ x: player.x+(Math.random()-0.5)*14, y: groundY+16, vx:(Math.random()-0.5)*2, vy:-1-Math.random(), life:16, maxLife:16 });
      playTone(220,0.1,'triangle',0.12);
    }
  }
  player.renderY = playerY;
  player.tilt += (player.targetTilt - player.tilt)*0.2;

  spawnTimer -= 1;
  if(spawnTimer<=0){ spawnObstacle(); spawnTimer = Math.max(28, 56 - score*0.05); }

  if(boosting && Math.random()<0.7){
    particles.push({x:player.x+(Math.random()-0.5)*10, y:playerY+16, vx:(Math.random()-0.5)*1, vy:3+Math.random()*2, life:16, maxLife:16, size:4+Math.random()*3, color: Math.random()<0.5?'#ff9f3d':'#ffd23f'});
  }
  if(!player.jumping && Math.random()<0.3){
    dust.push({ x: player.x+(Math.random()<0.5?-10:10), y: groundY+16, vx:(Math.random()-0.5)*0.6, vy:-0.4, life:12, maxLife:12 });
  }

  ctx.font = '32px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=obstacles.length-1;i>=0;i--){
    const o = obstacles[i];
    o.y += curSpeed + 1.2;
    if(o.type==='rock') ctx.fillText('🪨', o.x, o.y);
    else if(o.type==='oil') ctx.fillText('🛢️', o.x, o.y);
    else { ctx.save(); ctx.shadowColor='#3dd6ff'; ctx.shadowBlur=12; ctx.fillText('⚡', o.x, o.y); ctx.restore(); }

    const closeEnough = Math.abs(o.x - player.x) < 28 && Math.abs(o.y - playerY) < 38;
    const clearedByJump = o.type==='rock' && player.jumping && player.renderY < groundY - 28;
    if(closeEnough){
      if(o.type==='nitro'){ nitro=Math.min(100,nitro+40); playTone(850,0.15,'triangle',0.18); obstacles.splice(i,1); continue; }
      if(!clearedByJump){ shakeMag=16; endGame(); ctx.restore(); return; }
    }
    if(o.y > H+50) obstacles.splice(i,1);
  }

  for(let i=dust.length-1;i>=0;i--){
    const d = dust[i]; d.x+=d.vx; d.y+=d.vy; d.life--;
    const a = Math.max(0,d.life/d.maxLife)*0.5;
    ctx.save(); ctx.globalAlpha=a; ctx.fillStyle='#c9a878';
    ctx.beginPath(); ctx.arc(d.x,d.y,4,0,Math.PI*2); ctx.fill(); ctx.restore();
    if(d.life<=0) dust.splice(i,1);
  }
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i]; p.x+=p.vx; p.y+=p.vy; p.life--;
    const a = Math.max(0,p.life/p.maxLife);
    ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*a+1,0,Math.PI*2); ctx.fill(); ctx.restore();
    if(p.life<=0) particles.splice(i,1);
  }

  drawBike(player.x, playerY, player.tilt, boosting, player.jumping);

  ctx.restore();
  raf = requestAnimationFrame(loop);
}

function moveLane(dir){
  if(!running) return;
  player.lane = Math.max(0, Math.min(laneCount-1, player.lane+dir));
  player.x = laneX(player.lane);
  player.targetTilt = dir*0.3;
  setTimeout(()=>{ player.targetTilt=0; }, 200);
  playClick(500);
}
function doJump(){
  if(!running || player.jumping) return;
  player.jumping = true; player.jumpV = 16;
  playTone(600,0.12,'triangle',0.15);
}
function setNitro(on){ if(!running) return; nitroActive = on && nitro>4; if(on) shakeMag=Math.max(shakeMag,3); }

document.getElementById('leftBtn').onclick = ()=>moveLane(-1);
document.getElementById('rightBtn').onclick = ()=>moveLane(1);
document.getElementById('jumpBtn').onclick = doJump;
const nitroBtn = document.getElementById('nitroBtn');
nitroBtn.addEventListener('mousedown', ()=>setNitro(true));
nitroBtn.addEventListener('mouseup', ()=>setNitro(false));
nitroBtn.addEventListener('touchstart', e=>{ e.preventDefault(); setNitro(true); }, {passive:false});
nitroBtn.addEventListener('touchend', e=>{ e.preventDefault(); setNitro(false); }, {passive:false});

window.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') moveLane(-1);
  if(e.key==='ArrowRight') moveLane(1);
  if(e.key==='ArrowUp' || e.key===' ') doJump();
  if(e.key==='Shift') setNitro(true);
});
window.addEventListener('keyup', e=>{ if(e.key==='Shift') setNitro(false); });

startGame();
</script>
</body>
</html>
