<body>
  <a class="back" href="index.html">← Oyunlara dön</a>
  <h1 id="title">🔀 Parça Değiştirme</h1>
  <div id="hud"><span>🔁 Takas: <span id="swaps">0</span></span><span>✅ Doğru: <span id="correctCount">0</span>/<span id="total">0</span></span></div>
  <div id="refRow"><span style="font-size:.85rem; opacity:.6; align-self:center;">Hedef sıra →</span><span id="refIcons"></span></div>
  <div class="panel" style="position:relative;">
    <button id="fsBtn" class="fs-btn">⛶</button>
    <div id="grid"></div>
    <div id="countdownOverlay"></div>
    <div id="overlay">
      <div class="big">🎉</div>
      <div class="msg">Tüm parçaları doğru sıraya dizerek resmi tamamladın!</div>
      <div class="result-grid" id="resultGrid"></div>
      <div class="stars" id="stars"></div>
      <button class="btn" onclick="init()">Tekrar Oyna</button>
      <a class="btn alt" href="index.html" style="text-decoration:none; display:inline-block;">Oyunlara Dön</a>
    </div>
  </div>
  <button id="muteCtl">🔊</button>
  <p style="font-size:.85rem; opacity:.7; margin-top:10px; text-align:center;">Sırayla iki parçaya dokun ve yerlerini birbirleriyle değiştir; tüm parçalar yukarıdaki hedef dizilişle eşleşene kadar denemeye devam et!</p>

<script src="common.js"></script>
<script>
const { theme, level } = getParams();
setTitle('Parça Değiştirme');
document.getElementById('title').textContent = `🔀 ${theme.name} Parça Değiştirme`;
document.documentElement.style.setProperty('--th-1', theme.hue1);
document.documentElement.style.setProperty('--th-2', theme.hue2);
document.documentElement.style.setProperty('--th-bg1', theme.bg1);
document.documentElement.style.setProperty('--th-bg2', theme.bg2);

let muted = localStorage.getItem('ok_parca_muted') === '1';
const muteCtl = document.getElementById('muteCtl');
muteCtl.textContent = muted ? '🔇' : '🔊';
muteCtl.addEventListener('click', ()=>{
  muted = !muted; localStorage.setItem('ok_parca_muted', muted?'1':'0');
  muteCtl.textContent = muted?'🔇':'🔊';
});
function snd(fn){ if(!muted) fn(); }
let started = false;

const size = [null,3,4,4,5][level];
const total = size*size;
const tileSize = size <= 3 ? 84 : (size === 4 ? 66 : 54);
document.getElementById('grid').style.gridTemplateColumns = `repeat(${size}, ${tileSize}px)`;
document.getElementById('total').textContent = total;

// tema simgelerini tekrar ederek benzersiz olmayan ama düzenli bir hedef desen oluştur
const basePalette = theme.emojis.slice(0, Math.min(theme.emojis.length, 4 + level));
const target = Array.from({length: total}, (_, i) => basePalette[i % basePalette.length]);
document.getElementById('refIcons').innerHTML = target.map(e=>`<span>${e}</span>`).join('');

let current, selected, swaps;

function init(){
  current = shuffle(target.map((v,i)=>i)).map(i=>target[i]);
  // hepsi zaten doğru olmasın diye küçük bir kontrol
  while(current.every((v,i)=>v===target[i])){
    current = shuffle(current);
  }
  selected = null; swaps = 0; started = false;
  document.getElementById('swaps').textContent = 0;
  document.getElementById('overlay').style.display = 'none';
  render();
  const cd = document.getElementById('countdownOverlay');
  cd.style.display = 'flex';
  runCountdown(cd, ()=>{ cd.style.display = 'none'; started = true; });
}

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let correctCount = 0;
  current.forEach((val, idx)=>{
    const div = document.createElement('div');
    const isCorrect = val === target[idx];
    if(isCorrect) correctCount++;
    div.className = 'cell ptile' + (isCorrect ? ' correct' : '') + (selected===idx ? ' selected' : '');
    div.style.width = tileSize+'px';
    div.style.height = tileSize+'px';
    div.textContent = val;
    div.onclick = ()=>handleClick(idx);
    grid.appendChild(div);
  });
  document.getElementById('correctCount').textContent = correctCount;
  if(correctCount === total){
    snd(playSuccess);
    const score = Math.max(0, total*3 - Math.max(0, swaps - total));
    const perfect = score >= total*3;
    renderResultGrid('resultGrid', [['TAKAS', swaps], ['SEVİYE', LEVEL_NAMES[level]]]);
    document.getElementById('stars').textContent = starRating(score, total*3);
    showOverlay('overlay', perfect ? {celebrate:true} : undefined);
    fireConfetti(document.querySelector('.panel'), perfect ? {big:true} : undefined);
  }
}

function handleClick(idx){
  if(!started) return;
  if(selected === null){
    selected = idx;
    snd(()=>playClick(430));
    render();
    return;
  }
  if(selected === idx){ selected = null; render(); return; }
  [current[selected], current[idx]] = [current[idx], current[selected]];
  swaps++;
  document.getElementById('swaps').textContent = swaps;
  snd(()=>playClick(520));
  selected = null;
  render();
}

init();

initFullscreenButton('fsBtn', document.querySelector('.panel'));
</script>
</body>
