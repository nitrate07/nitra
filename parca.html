<html lang="tr">
<head>

<meta name="description" content="Doğru parçayı bul, bulmacayı tamamla! Ücretsiz parça değiştirme oyunu, çocuklar için güvenli.">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  #refRow{display:flex; gap:6px; margin-bottom:12px; background:#F1EEFF; padding:10px 12px; border-radius:12px; flex-wrap:wrap; justify-content:center; max-width:320px;}
  #refRow span{font-size:1.3rem;}
  #grid{display:grid; gap:8px;}
  .ptile{background:#fff; box-shadow:0 4px 0 #ddd; font-size:1.8rem;}
  .ptile.selected{outline:3px solid var(--purple); transform:scale(1.05);}
  .ptile.correct{background:var(--teal); box-shadow:0 4px 0 var(--teal-dark);}
</style>
</head>
<body>
  <a class="back" href="index.html">← Oyunlara dön</a>
  <h1 id="title">🔀 Parça Değiştirme</h1>
  <div id="hud"><span>🔁 Takas: <span id="swaps">0</span></span><span>✅ Doğru: <span id="correctCount">0</span>/<span id="total">0</span></span></div>
  <div id="refRow"><span style="font-size:.85rem; opacity:.6; align-self:center;">Hedef sıra →</span><span id="refIcons"></span></div>
  <div class="panel">
    <div id="grid"></div>
    <div id="overlay">
      <div class="big">🎉</div>
      <div class="msg">Resmi doğru sıraya soktun!</div>
      <div class="stars" id="stars"></div>
      <button class="btn" onclick="init()">Tekrar Oyna</button>
      <a class="btn alt" href="index.html" style="text-decoration:none; display:inline-block;">Oyunlara Dön</a>
    </div>
  </div>
  <p style="font-size:.85rem; opacity:.7; margin-top:10px; text-align:center;">İki parçaya sırayla tıkla, yerlerini değiştir. Hepsi hedef sırayla eşleşsin!</p>

<script src="common.js"></script>
<script>
const { theme, level } = getParams();
setTitle('Parça Değiştirme');
document.getElementById('title').textContent = `🔀 ${theme.name} Parça Değiştirme`;

const size = [null,3,4,4,5][level];
const total = size*size;
const tileSize = size <= 3 ? 84 : (size === 4 ? 66 : 54);
document.getElementById('grid').style.gridTemplateColumns = `repeat(${size}, ${tileSize}px)`;
document.getElementById('total').textContent = total;

// tema simgelerini tekrar ederek benzersiz olmayan ama düzenli bir hedef desen oluştur
const basePalette = theme.emojis.slice(0, Math.min(theme.emojis.length, 4 + level));
const target = Array.from({length: total}, (_, i) => basePalette[i % basePalette.length]);
document.getElementById('refIcons').innerHTML = target.map(e=>`<span>${e}</span>`).join('');

let current, selected, swaps;

function init(){
  current = shuffle(target.map((v,i)=>i)).map(i=>target[i]);
  // hepsi zaten doğru olmasın diye küçük bir kontrol
  while(current.every((v,i)=>v===target[i])){
    current = shuffle(current);
  }
  selected = null; swaps = 0;
  document.getElementById('swaps').textContent = 0;
  document.getElementById('overlay').style.display = 'none';
  render();
}

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let correctCount = 0;
  current.forEach((val, idx)=>{
    const div = document.createElement('div');
    const isCorrect = val === target[idx];
    if(isCorrect) correctCount++;
    div.className = 'cell ptile' + (isCorrect ? ' correct' : '') + (selected===idx ? ' selected' : '');
    div.style.width = tileSize+'px';
    div.style.height = tileSize+'px';
    div.textContent = val;
    div.onclick = ()=>handleClick(idx);
    grid.appendChild(div);
  });
  document.getElementById('correctCount').textContent = correctCount;
  if(correctCount === total){
    playSuccess();
    const score = Math.max(0, total*3 - Math.max(0, swaps - total));
    document.getElementById('stars').textContent = starRating(score, total*3);
    document.getElementById('overlay').style.display = 'flex';
    fireConfetti(document.querySelector('.panel'));
  }
}

function handleClick(idx){
  if(selected === null){
    selected = idx;
    playClick(430);
    render();
    return;
  }
  if(selected === idx){ selected = null; render(); return; }
  [current[selected], current[idx]] = [current[idx], current[selected]];
  swaps++;
  document.getElementById('swaps').textContent = swaps;
  playClick(520);
  selected = null;
  render();
}

init();
</script>
</body>
</html>
