    <span>🐱 Puan: <span id="score">0</span></span>

<script src="common.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Retina/yuksek DPI netligi: mantiksal oyun boyutu (W x H) degismiyor, sadece
// canvas'in gercek piksel arka bellegi ekran yogunluguna gore buyutuluyor ve
// tum cizimler ctx.scale ile bu olcege otomatik uyduruluyor.
const DPR = Math.min(window.devicePixelRatio || 1, 2.5);
canvas.width = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);
let bestScore = parseInt(localStorage.getItem('ok_yakalama_best') || '0', 10);
document.getElementById('best').textContent = bestScore;

let cat = {x: W/2, w: 60, h: 40};
let items = [];
let score = 0, timeLeft = 30, running = false, raf;
let combo = 0, comboLevel = 1;

function spawnItem(){
  const isBad = Math.random() < 0.2;
  items.push({
    x: 20 + Math.random()*(W-40),
    y: -20,
    speed: 2 + Math.random()*2 + timeLeft*-0.02,
    emoji: isBad ? '🦴' : (Math.random()<0.5 ? '🐟' : '🍣'),
    bad: isBad,
    caught: false, life: 0
  });
}

let spawnTimer, tickTimer;

function startGame(){
  score = 0; timeLeft = 30; items = []; running = true; combo = 0; comboLevel = 1;
  document.getElementById('score').textContent = score;
  document.getElementById('time').textContent = timeLeft;
  document.getElementById('overlay').style.display = 'none';
  if(spawnTimer) clearInterval(spawnTimer);
  if(tickTimer) clearInterval(tickTimer);
  spawnTimer = setInterval(spawnItem, 700);
  tickTimer = setInterval(()=>{
    timeLeft--;
    document.getElementById('time').textContent = timeLeft;
    if(timeLeft<=0) endGame();
  }, 1000);
  loop();
}

function endGame(){
  running = false;
  clearInterval(spawnTimer);
  clearInterval(tickTimer);
  cancelAnimationFrame(raf);
  if(score > bestScore){ bestScore = score; localStorage.setItem('ok_yakalama_best', bestScore); }
  document.getElementById('best').textContent = bestScore;
  document.getElementById('overMsg').textContent = 'Süre Doldu!';
  renderResultGrid('resultGrid', [['PUAN', score], ['REKOR', bestScore]]);
  document.getElementById('stars').textContent = starRating(score, 20);
  showOverlay('overlay', score >= 20 ? {celebrate:true} : undefined);
  if(score >= 20) fireConfetti(document.getElementById('wrap'), {big:true});
  playSuccess();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  for(let i=items.length-1;i>=0;i--){
    const it = items[i];
    if(it.caught){
      it.life++;
      ctx.save(); ctx.globalAlpha = Math.max(0,1-it.life/14); ctx.font = (28+it.life*2)+'px serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(it.emoji, it.x, it.y - it.life);
      ctx.restore();
      if(it.life>14) items.splice(i,1);
      continue;
    }
    it.y += it.speed;
    ctx.font = '28px serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(it.emoji, it.x, it.y);
    if(it.y > H-70 && it.y < H-20 && Math.abs(it.x - cat.x) < cat.w/2+10){
      if(it.bad){
        score = Math.max(0, score-1); combo = 0; comboLevel = 1;
        playError();
        items.splice(i,1);
      } else {
        combo++; comboLevel = Math.min(4, 1+Math.floor(combo/3));
        score += comboLevel;
        playClick(600+comboLevel*60);
        it.caught = true;
      }
      document.getElementById('score').textContent = score;
      continue;
    }
    if(it.y > H+20){ items.splice(i,1); combo = 0; comboLevel = 1; }
  }
  ctx.font = '48px serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🐱', cat.x, H-40);

  if(running) raf = requestAnimationFrame(loop);
}

function setCatX(clientX){
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) * (W/rect.width);
  cat.x = Math.max(30, Math.min(W-30, x));
}

canvas.addEventListener('mousemove', (e)=> setCatX(e.clientX));
canvas.addEventListener('touchmove', (e)=>{ e.preventDefault(); setCatX(e.touches[0].clientX); }, {passive:false});
canvas.addEventListener('touchstart', (e)=>{ setCatX(e.touches[0].clientX); }, {passive:true});

startGame();

initFullscreenButton('fsBtn', document.getElementById('wrap'));
initLandscapeHint();
</script>
