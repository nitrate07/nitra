  <p style="font-size:.85rem; opacity:.7; margin-top:10px; text-align:center;">Sipariş kartındaki sırayı takip ederek tepsiden doğru malzemeyi seç, sandviçini adım adım inşa et!</p>

<script src="common.js"></script>
<script>
const ALL_INGREDIENTS = ['🍞','🧀','🥬','🍅','🥓','🍳','🥒','🧅','🍔','🥕'];
const goalRounds = 8;
let round = 0, wrong = 0, recipe = [], built = [], running = false, combo;

let muted = localStorage.getItem('ok_sandvic_muted') === '1';
const muteCtl = document.getElementById('muteCtl');
muteCtl.textContent = muted ? '🔇' : '🔊';
muteCtl.addEventListener('click', ()=>{ muted=!muted; localStorage.setItem('ok_sandvic_muted', muted?'1':'0'); muteCtl.textContent = muted?'🔇':'🔊'; });
function snd(fn){ if(!muted) fn(); }

function updateProgress(){
  document.getElementById('progressFill').style.width = Math.min(100, Math.round((round/goalRounds)*100)) + '%';
}

function startGame(){
  round = 0; wrong = 0; running = false; combo = createCombo();
  document.getElementById('wrong').textContent = 0;
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('comboBadge').style.display = 'none';
  updateProgress();
  const cd = document.getElementById('countdownOverlay');
  cd.style.display = 'flex';
  runCountdown(cd, ()=>{ cd.style.display = 'none'; running = true; nextRound(); });
}

function nextRound(){
  round++;
  document.getElementById('round').textContent = round;
  updateProgress();
  const len = Math.min(6, 3 + Math.floor(round/2));
  recipe = ['🍞'];
  const middle = shuffle(ALL_INGREDIENTS.filter(i=>i!=='🍞')).slice(0, len-2);
  recipe.push(...middle);
  recipe.push('🍞');
  built = [];

  document.getElementById('recipeIcons').innerHTML = recipe.map(i=>`<span>${i}</span>`).join('');
  document.getElementById('stackArea').innerHTML = '';

  const distractors = shuffle(ALL_INGREDIENTS.filter(i=>!recipe.includes(i))).slice(0,3);
  const trayItems = shuffle([...new Set(recipe), ...distractors]);
  const tray = document.getElementById('tray');
  tray.innerHTML = '';
  trayItems.forEach(ic=>{
    const div = document.createElement('div');
    div.className = 'ing pop';
    div.textContent = ic;
    div.onclick = ()=>handlePick(ic);
    tray.appendChild(div);
  });
}

function handlePick(ic){
  if(!running) return;
  const expected = recipe[built.length];
  if(ic === expected){
    built.push(ic);
    snd(()=>playClick(500));
    const el = document.createElement('div');
    el.className = 'stack-item pop';
    el.textContent = ic;
    document.getElementById('stackArea').appendChild(el);
    if(built.length === recipe.length){
      const level = combo.register();
      renderComboBadge('comboBadge', level);
      snd(playSuccess);
      if(level>1) snd(()=>playCombo(level));
      fireConfetti(document.querySelector('.panel'));
      setTimeout(nextRound, 900);
    }
  } else {
    wrong++;
    combo.reset();
    document.getElementById('comboBadge').style.display = 'none';
    document.getElementById('wrong').textContent = wrong;
    snd(playError);
    triggerWrongFx(document.querySelector('.panel'));
    if(wrong >= 3){
      running = false;
      document.getElementById('overMsg').textContent = `Bu turda ${round-1} sipariş tamamladın!`;
      renderResultGrid('resultGrid', [['SİPARİŞ', round-1], ['EN İYİ SERİ', 'x'+combo.level]]);
      document.getElementById('stars').textContent = starRating(round-1, goalRounds);
      showOverlay('overlay');
    }
  }
}

startGame();

initFullscreenButton('fsBtn', document.querySelector('.panel'));
</script>
