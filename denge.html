<script src="common.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Retina/yuksek DPI netligi: mantiksal oyun boyutu (W x H) degismiyor, sadece
// canvas'in gercek piksel arka bellegi ekran yogunluguna gore buyutuluyor ve
// tum cizimler ctx.scale ile bu olcege otomatik uyduruluyor.
const DPR = Math.min(window.devicePixelRatio || 1, 2.5);
canvas.width = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);
const ROPE_Y = H*0.55;

let bestScore = parseInt(localStorage.getItem('ok_denge_best') || '0', 10);
document.getElementById('best').textContent = bestScore;

function drawWalker(x,tilt){
  ctx.save(); ctx.translate(x,ROPE_Y); ctx.rotate(tilt);
  ctx.strokeStyle='#2b2b40'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-16,-6); ctx.lineTo(16,-6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(0,14); ctx.stroke();
  ctx.fillStyle='#ff6ec7'; ctx.beginPath(); ctx.arc(0,-14,9,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

let walkerX, targetX, obstacles, score, speed, running, spawnTimer, raf, particles, shaker, combo;

function startGame(){
  walkerX = W/2; targetX = W/2;
  obstacles=[]; score=0; speed=2.4; running=false; spawnTimer=0;
  particles = []; shaker = createShaker(); combo = createCombo(150);
  document.getElementById('score').textContent=0;
  document.getElementById('overlay').style.display='none';
  document.getElementById('comboBadge').style.display='none';
  ctx.clearRect(0,0,W,H);
  drawWalker(walkerX, 0);
  runCountdown(document.getElementById('countdownOverlay'), ()=>{ running = true; loop(); });
}
function spawnObstacle(){
  const isFlag = Math.random()<0.25;
  obstacles.push({ x: W/2+(Math.random()<0.5?-1:1)*(60+Math.random()*(W/2-60)), y:-30, emoji: isFlag?'🚩':['🐦','☁️'][Math.floor(Math.random()*2)], isFlag });
}
function endGame(){
  running=false;
  const s=Math.floor(score);
  if(s>bestScore){ bestScore=s; localStorage.setItem('ok_denge_best', bestScore); }
  document.getElementById('best').textContent=bestScore;
  document.getElementById('overMsg').textContent=`İpin üstünde tam ${s} puan topladın!`;
  renderResultGrid('resultGrid', [['PUAN', s], ['REKOR', bestScore], ['EN İYİ SERİ', 'x'+combo.level]]);
  document.getElementById('stars').textContent=starRating(s,350);
  showOverlay('overlay', s >= 220 ? {celebrate:true} : undefined);
  if(s >= 220) fireConfetti(document.getElementById('wrap'), {big:true});
  playError();
}
function loop(){
  if(!running) return;
  combo.tick();
  const sh = shaker.tick();
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(sh.x, sh.y);
  speed = 2.4 + score*0.008;
  score += 0.3;
  document.getElementById('score').textContent = Math.floor(score);

  ctx.strokeStyle='#8a5a2a'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(10,ROPE_Y+16); ctx.lineTo(W-10,ROPE_Y+16); ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(0,ROPE_Y+16,W,H-ROPE_Y-16);

  walkerX += (targetX-walkerX)*0.15;
  walkerX = Math.max(20, Math.min(W-20, walkerX));
  const tilt = (targetX-walkerX)*0.01;

  spawnTimer-=1; if(spawnTimer<=0){ spawnObstacle(); spawnTimer=Math.max(38,72-score*0.12); }

  ctx.font='26px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i]; o.y+=speed+1.2;
    ctx.fillText(o.emoji,o.x,o.y);
    const dist = Math.hypot(o.x-walkerX, o.y-ROPE_Y);
    if(dist<24){
      if(o.isFlag){
        const level = combo.register();
        renderComboBadge('comboBadge', level);
        const gained = 25*level;
        score+=gained; playTone(750,0.1,'triangle',0.15);
        if(level>1) playCombo(level);
        spawnParticles(particles, o.x, o.y, 9, ['#FFD23F','#7bff6b'], {speed:3.5, life:20});
        const pr = document.getElementById('wrap').getBoundingClientRect(), r = canvas.getBoundingClientRect();
        showFloatingPoints(document.getElementById('wrap'), (r.left-pr.left)+o.x*(r.width/W), (r.top-pr.top)+o.y*(r.height/H),
          level>1 ? `🔥 x${level} +${gained}` : `+${gained}`, '#FFD23F');
        obstacles.splice(i,1); continue;
      }
      shaker.trigger(14);
      spawnParticles(particles, walkerX, ROPE_Y, 14, ['#ff6b6b','#c94b4b'], {speed:4, life:20});
      updateParticles(ctx, particles);
      ctx.restore();
      endGame(); return;
    }
    if(o.y>H+30) obstacles.splice(i,1);
  }

  drawWalker(walkerX, tilt);
  updateParticles(ctx, particles);
  ctx.restore();
  raf = requestAnimationFrame(loop);
}
function setTargetX(clientX){ const rect=canvas.getBoundingClientRect(); targetX=(clientX-rect.left)*(W/rect.width); }
canvas.addEventListener('mousemove', e=>setTargetX(e.clientX));
canvas.addEventListener('touchmove', e=>{ e.preventDefault(); setTargetX(e.touches[0].clientX); }, {passive:false});
startGame();

initFullscreenButton('fsBtn', document.getElementById('wrap'));
initLandscapeHint();
</script>
