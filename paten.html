<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paten Kaçışı — Oyun Kutusu</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  body{ background:radial-gradient(circle at 50% 0%, #fff3d6, #ffe0a3 70%); }
  h1{ font-family:'Fredoka',sans-serif; color:var(--ink); }
  canvas{background:#c9c9d4; touch-action:none;}
  .controls{display:flex; gap:12px; margin-top:14px;}
  .ctl{width:64px; height:54px; border:none; border-radius:14px; background:#ff9f5a; color:#fff; font-size:1.5rem;
    box-shadow:0 4px 0 #c9762a; cursor:pointer;}
  .ctl:active{transform:translateY(3px);}
  p.hint{font-size:.85rem; opacity:.7; margin-top:8px; text-align:center; max-width:340px;}
</style>
</head>
<body>
  <a class="back" href="index.html">← Oyunlara dön</a>
  <h1>⛸️ Paten Kaçışı</h1>
  <div id="hud"><span>📍 <span id="score">0</span> m</span><span>🏆 <span id="best">0</span> m</span></div>
  <div id="wrap">
    <canvas id="c" width="340" height="520"></canvas>
    <div id="overlay">
      <div class="big">💥</div>
      <div class="msg" id="overMsg"></div>
      <div class="stars" id="stars"></div>
      <button class="btn" onclick="startGame()">Tekrar Oyna</button>
      <a class="btn alt" href="index.html" style="text-decoration:none; display:inline-block;">Oyunlara Dön</a>
    </div>
  </div>
  <div class="controls">
    <button class="ctl" id="leftBtn">◀</button>
    <button class="ctl" id="rightBtn">▶</button>
  </div>
  <p class="hint">Şerit değiştirerek yayalardan ve çöp kutularından kaç, madalya topla!</p>

<script src="common.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const laneCount = 3;
const ROAD_MARGIN = 30;
const roadWidth = W - ROAD_MARGIN*2;
const laneW = roadWidth / laneCount;
const laneX = i => ROAD_MARGIN + laneW*i + laneW/2;

let bestScore = parseInt(localStorage.getItem('ok_paten_best') || '0', 10);
document.getElementById('best').textContent = bestScore;

let player, obstacles, score, speed, running, spawnTimer, roadOffset, raf;

function startGame(){
  player = { lane:1, x:laneX(1), tilt:0, targetTilt:0 };
  obstacles=[]; score=0; speed=3.4; running=true; roadOffset=0; spawnTimer=0;
  document.getElementById('score').textContent=0;
  document.getElementById('overlay').style.display='none';
  loop();
}
function spawnObstacle(){
  const lane=Math.floor(Math.random()*laneCount); const isMedal=Math.random()<0.2;
  obstacles.push({lane, x:laneX(lane), y:-50, emoji: isMedal?'🏅':['🧍','🗑️','🚲'][Math.floor(Math.random()*3)], isMedal});
}
function endGame(){
  running=false;
  const d=Math.floor(score);
  if(d>bestScore){ bestScore=d; localStorage.setItem('ok_paten_best', bestScore); }
  document.getElementById('best').textContent=bestScore;
  document.getElementById('overMsg').textContent=`${d} metre gidebildin!`;
  document.getElementById('stars').textContent=starRating(d,700);
  document.getElementById('overlay').style.display='flex';
  playError();
}
function loop(){
  if(!running) return;
  speed = 3.4 + score*0.004;
  score += speed*0.08;
  document.getElementById('score').textContent = Math.floor(score);
  roadOffset = (roadOffset+speed)%38;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#e8d8b0'; ctx.fillRect(0,0,ROAD_MARGIN,H); ctx.fillRect(W-ROAD_MARGIN,0,ROAD_MARGIN,H);
  ctx.fillStyle='#c9c9d4'; ctx.fillRect(ROAD_MARGIN,0,roadWidth,H);
  ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=3; ctx.setLineDash([16,16]);
  for(let i=1;i<laneCount;i++){ ctx.beginPath(); ctx.moveTo(ROAD_MARGIN+laneW*i, roadOffset-38); ctx.lineTo(ROAD_MARGIN+laneW*i,H); ctx.stroke(); }
  ctx.setLineDash([]);

  spawnTimer-=1; if(spawnTimer<=0){ spawnObstacle(); spawnTimer=Math.max(26,52-score*0.05); }
  player.tilt += (player.targetTilt-player.tilt)*0.2;

  ctx.font='30px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i]; o.y+=speed+1.2;
    ctx.fillText(o.emoji,o.x,o.y);
    if(Math.abs(o.x-player.x)<28 && Math.abs(o.y-(H-90))<40){
      if(o.isMedal){ score+=25; playTone(700,0.1,'triangle',0.15); obstacles.splice(i,1); continue; }
      endGame(); return;
    }
    if(o.y>H+50) obstacles.splice(i,1);
  }
  ctx.save(); ctx.translate(player.x, H-90); ctx.rotate(player.tilt);
  ctx.font='40px serif'; ctx.fillText('🧑‍🦽‍➡️'.length ? '🧑' : '🧑', 0, 0);
  ctx.font='40px serif'; ctx.fillText('⛸️', 0, 14);
  ctx.restore();
  raf = requestAnimationFrame(loop);
}
function moveLane(dir){ if(!running) return; player.lane=Math.max(0,Math.min(laneCount-1,player.lane+dir)); player.x=laneX(player.lane);
  player.targetTilt=dir*0.3; setTimeout(()=>{player.targetTilt=0;},200); playClick(500); }
document.getElementById('leftBtn').onclick=()=>moveLane(-1);
document.getElementById('rightBtn').onclick=()=>moveLane(1);
window.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') moveLane(-1); if(e.key==='ArrowRight') moveLane(1); });
let touchStartX=null;
canvas.addEventListener('touchstart', e=>{ touchStartX=e.touches[0].clientX; });
canvas.addEventListener('touchend', e=>{ if(touchStartX===null) return; const dx=e.changedTouches[0].clientX-touchStartX;
  if(dx>30) moveLane(1); else if(dx<-30) moveLane(-1); touchStartX=null; });
startGame();
</script>
</body>
</html>
