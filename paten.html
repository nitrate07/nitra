  <a class="back" href="index.html">← Oyunlara dön</a>
  <h1>⛸️ Paten Kaçışı</h1>
  <div id="hud">
    <span>📍 <span id="score">0</span> m</span>
    <span id="comboBadge" class="combo-badge" style="display:none;"></span>

  </div>

      <button class="btn" onclick="startGame()">Tekrar Oyna</button>

  <p class="hint">Şeritler arasında hızlıca geçiş yaparak yayalardan, bisikletlerden ve çöp kutularından ustaca kaç, yolda parıldayan madalyaları topla!</p>

<script src="common.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Retina/yuksek DPI netligi: mantiksal oyun boyutu (W x H) degismiyor, sadece
// canvas'in gercek piksel arka bellegi ekran yogunluguna gore buyutuluyor ve
// tum cizimler ctx.scale ile bu olcege otomatik uyduruluyor.
const DPR = Math.min(window.devicePixelRatio || 1, 2.5);
canvas.width = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);
const laneCount = 3;
const ROAD_MARGIN = 30;
const roadWidth = W - ROAD_MARGIN*2;
const laneW = roadWidth / laneCount;
const laneX = i => ROAD_MARGIN + laneW*i + laneW/2;

let bestScore = parseInt(localStorage.getItem('ok_paten_best') || '0', 10);
document.getElementById('best').textContent = bestScore;
let muted = localStorage.getItem('ok_paten_muted') === '1';
const muteCtl = document.getElementById('muteCtl');
muteCtl.textContent = muted ? '🔇' : '🔊';
muteCtl.addEventListener('click', ()=>{ muted=!muted; localStorage.setItem('ok_paten_muted', muted?'1':'0'); muteCtl.textContent = muted?'🔇':'🔊'; });
function snd(fn){ if(!muted) fn(); }

let player, obstacles, score, speed, running, spawnTimer, roadOffset, raf;
let particles, shaker, combo;

function startGame(){
  player = { lane:1, x:laneX(1), tilt:0, targetTilt:0 };
  obstacles=[]; score=0; speed=3.4; running=false; roadOffset=0; spawnTimer=0;
  particles = []; shaker = createShaker(); combo = createCombo();
  document.getElementById('score').textContent=0;
  document.getElementById('overlay').style.display='none';
  document.getElementById('comboBadge').style.display='none';
  ctx.clearRect(0,0,W,H);
  runCountdown(document.getElementById('countdownOverlay'), ()=>{ running = true; loop(); });
}
function spawnObstacle(){
  const lane=Math.floor(Math.random()*laneCount); const isMedal=Math.random()<0.2;
  obstacles.push({lane, x:laneX(lane), y:-50, emoji: isMedal?'🏅':['🧍','🗑️','🚲'][Math.floor(Math.random()*3)], isMedal});
}
function endGame(){
  running=false;
  cancelAnimationFrame(raf);
  const d=Math.floor(score);
  if(d>bestScore){ bestScore=d; localStorage.setItem('ok_paten_best', bestScore); }
  document.getElementById('best').textContent=bestScore;
  document.getElementById('overMsg').textContent=`Harika patenli koşu! Sokaklarda ${d} metre kayarak ilerledin.`;
  renderResultGrid('resultGrid', [['MESAFE', d+' m'], ['REKOR', bestScore+' m'], ['EN İYİ SERİ', 'x'+combo.level]]);
  document.getElementById('stars').textContent=starRating(d,700);
  showOverlay('overlay', d >= 500 ? {celebrate:true} : undefined);
  if(d >= 500) fireConfetti(document.getElementById('wrap'), {big:true});
  snd(playError);
}
function loop(){
  if(!running) return;
  combo.tick();
  const sh = shaker.tick();
  speed = 3.4 + score*0.004;
  score += speed*0.08;
  document.getElementById('score').textContent = Math.floor(score);
  roadOffset = (roadOffset+speed)%38;
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(sh.x, sh.y);
  ctx.fillStyle='#e8d8b0'; ctx.fillRect(0,0,ROAD_MARGIN,H); ctx.fillRect(W-ROAD_MARGIN,0,ROAD_MARGIN,H);
  ctx.fillStyle='#c9c9d4'; ctx.fillRect(ROAD_MARGIN,0,roadWidth,H);
  ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=3; ctx.setLineDash([16,16]);
  for(let i=1;i<laneCount;i++){ ctx.beginPath(); ctx.moveTo(ROAD_MARGIN+laneW*i, roadOffset-38); ctx.lineTo(ROAD_MARGIN+laneW*i,H); ctx.stroke(); }
  ctx.setLineDash([]);

  spawnTimer-=1; if(spawnTimer<=0){ spawnObstacle(); spawnTimer=Math.max(26,52-score*0.05); }
  player.tilt += (player.targetTilt-player.tilt)*0.2;

  ctx.font='30px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i]; o.y+=speed+1.2;
    ctx.fillText(o.emoji,o.x,o.y);
    if(Math.abs(o.x-player.x)<28 && Math.abs(o.y-(H-90))<40){
      if(o.isMedal){
        const level = combo.register();
        renderComboBadge('comboBadge', level);
        const gained = 25*level;
        score+=gained;
        snd(()=>playTone(700,0.1,'triangle',0.15));
        if(level>1) snd(()=>playCombo(level));
        spawnParticles(particles, o.x, o.y, 9, ['#FFD23F','#FF9F5A'], {speed:3.5, life:20});
        const pr = document.getElementById('wrap').getBoundingClientRect(), r = canvas.getBoundingClientRect();
        showFloatingPoints(document.getElementById('wrap'), (r.left-pr.left)+o.x*(r.width/W), (r.top-pr.top)+o.y*(r.height/H),
          level>1 ? `🔥 x${level} +${gained}` : `+${gained}`, '#FFD23F');
        obstacles.splice(i,1); continue;
      }
      shaker.trigger(14);
      spawnParticles(particles, player.x, H-90, 14, ['#ff6b6b','#c94b4b'], {speed:4, life:20});
      updateParticles(ctx, particles);
      ctx.restore();
      endGame(); return;
    }
    if(o.y>H+50) obstacles.splice(i,1);
  }
  ctx.save(); ctx.translate(player.x, H-90); ctx.rotate(player.tilt);
  ctx.font='40px serif'; ctx.fillText('🧑', 0, 0);
  ctx.font='40px serif'; ctx.fillText('⛸️', 0, 14);
  ctx.restore();

  updateParticles(ctx, particles);
  ctx.restore();
  raf = requestAnimationFrame(loop);
}
function moveLane(dir){ if(!running) return; player.lane=Math.max(0,Math.min(laneCount-1,player.lane+dir)); player.x=laneX(player.lane);
  player.targetTilt=dir*0.3; setTimeout(()=>{player.targetTilt=0;},200); snd(()=>playClick(500)); }
document.getElementById('leftBtn').onclick=()=>moveLane(-1);
document.getElementById('rightBtn').onclick=()=>moveLane(1);
window.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') moveLane(-1); if(e.key==='ArrowRight') moveLane(1); });
let touchStartX=null;
canvas.addEventListener('touchstart', e=>{ touchStartX=e.touches[0].clientX; });
canvas.addEventListener('touchend', e=>{ if(touchStartX===null) return; const dx=e.changedTouches[0].clientX-touchStartX;
  if(dx>30) moveLane(1); else if(dx<-30) moveLane(-1); touchStartX=null; });
startGame();

initFullscreenButton('fsBtn', document.getElementById('wrap'));
initLandscapeHint();
</script>
